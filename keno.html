<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Keno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-purple: #6c5ce7; --accent-gold: #ffc107; --accent-green: #00b894;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: #238cf5; }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-purple); }

        .layout { display: flex; gap: 20px; justify-content: center; align-items: flex-start; padding: 30px 15px; max-width: 1000px; margin: auto; width: 100%; }

        /* Left Side: Grid */
        .game-main { flex: 2; background: var(--bg-panel); border-radius: 16px; border: 1px solid var(--border-color); padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 20px; }
        
        .keno-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
        .k-num { aspect-ratio: 1; background: var(--bg-card); border: 2px solid #203a56; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: 900; cursor: pointer; transition: 0.2s; user-select: none; }
        .k-num:hover:not(.drawn) { background: #2a4b6d; }
        .k-num.selected { background: var(--accent-purple); border-color: #fff; box-shadow: 0 0 15px rgba(108, 92, 231, 0.6); }
        .k-num.drawn { background: #e74c3c; border-color: #ff7675; }
        .k-num.matched { background: var(--accent-gold); border-color: #fff; color: #111; box-shadow: 0 0 20px rgba(255, 193, 7, 0.8); transform: scale(1.1); z-index: 2; }

        /* Controls */
        .controls-row { display: flex; gap: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-base); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-draw { flex: 1; background: var(--accent-green); color: white; font-size: 20px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 0 #008f72; transition: 0.1s; }
        .btn-draw:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #008f72; }
        .btn-draw:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; transform: none; }
        
        .btn-clear { background: var(--bg-card); color: white; border: 1px solid var(--border-color); padding: 0 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        /* Right Side: Info Panel */
        .side-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        
        .status-box { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; text-align: center; }
        .status-header { font-size: 14px; font-weight: bold; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 5px; }
        .status-val { font-size: 24px; font-weight: 900; color: var(--accent-gold); }

        .paytable { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .pt-title { font-size: 14px; font-weight: 900; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 10px; color: var(--accent-purple); text-align: center; }
        .pt-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #1a3148; }
        .pt-row:last-child { border-bottom: none; }
        .pt-match { color: var(--text-muted); }
        .pt-multi { font-weight: bold; color: #fff; }
        .pt-row.active { background: rgba(255, 193, 7, 0.2); border-radius: 4px; padding: 6px 5px; color: var(--accent-gold); }

        /* Balls Tray */
        .balls-tray { display: flex; flex-wrap: wrap; gap: 10px; min-height: 40px; margin-top: 10px; }
        .drawn-ball { width: 35px; height: 35px; border-radius: 50%; background: radial-gradient(circle at top left, #ff7675, #e74c3c); display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .drawn-ball.matched { background: radial-gradient(circle at top left, #ffeaa7, #fdcb6e); color: #111; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .keno-grid { grid-template-columns: repeat(5, 1fr); }
            .controls-row { flex-direction: column; }
            .btn-draw, .btn-clear { padding: 15px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="wallet">₹ <span id="balance">10000.00</span></div>
    </header>

    <div class="layout">
        <div class="game-main">
            <div class="status-header" style="text-align:center;">PICK 1 TO 10 NUMBERS</div>
            <div class="keno-grid" id="grid">
                <!-- JS generated -->
            </div>

            <div class="balls-tray" id="tray"></div>

            <div class="controls-row">
                <div class="input-group">
                    <label>BET AMOUNT (₹)</label>
                    <input type="number" id="betAmount" value="100" min="10">
                </div>
                <button class="btn-clear" onclick="clearSelection()">CLEAR</button>
                <button class="btn-draw" id="btnDraw" onclick="startDraw()">DRAW 10</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="status-box">
                <div class="status-header" id="statusHeader">SELECTED</div>
                <div class="status-val" id="statusVal">0 / 10</div>
            </div>

            <div class="paytable" id="paytable">
                <div class="pt-title">PAYTABLE</div>
                <div style="text-align:center; font-size:12px; color:#888;">Select numbers to view payouts</div>
            </div>
        </div>
    </div>

    <script>
        let balance = 10000.00;
        let selectedNumbers = [];
        let isDrawing = false;
        const maxPicks = 10;
        const totalDraws = 10;

        const balanceEl = document.getElementById('balance');
        const grid = document.getElementById('grid');
        const tray = document.getElementById('tray');
        const btnDraw = document.getElementById('btnDraw');
        const statusHeader = document.getElementById('statusHeader');
        const statusVal = document.getElementById('statusVal');
        const paytableEl = document.getElementById('paytable');

        // Dynamic Paytable Matrix (Hits needed based on picks)
        const payoutMatrix = {
            1: { 1: 3.5 },
            2: { 1: 1.0, 2: 8.0 },
            3: { 2: 2.0, 3: 20.0 },
            4: { 2: 1.0, 3: 4.0, 4: 50.0 },
            5: { 3: 2.0, 4: 15.0, 5: 150.0 },
            6: { 3: 1.0, 4: 5.0, 5: 40.0, 6: 400.0 },
            7: { 3: 0.5, 4: 2.0, 5: 15.0, 6: 100.0, 7: 1000.0 },
            8: { 4: 2.0, 5: 8.0, 6: 40.0, 7: 300.0, 8: 2500.0 },
            9: { 4: 1.0, 5: 4.0, 6: 15.0, 7: 100.0, 8: 1000.0, 9: 5000.0 },
            10:{ 0: 2.0, 5: 2.0, 6: 10.0, 7: 40.0, 8: 200.0, 9: 2000.0, 10: 10000.0 }
        };

        // Initialize Grid
        for (let i = 1; i <= 40; i++) {
            const btn = document.createElement('div');
            btn.className = 'k-num';
            btn.innerText = i;
            btn.onclick = () => toggleNumber(i, btn);
            grid.appendChild(btn);
        }

        function toggleNumber(num, el) {
            if (isDrawing) return;
            
            const idx = selectedNumbers.indexOf(num);
            if (idx > -1) {
                selectedNumbers.splice(idx, 1);
                el.classList.remove('selected');
            } else {
                if (selectedNumbers.length >= maxPicks) return alert(`Max ${maxPicks} numbers!`);
                selectedNumbers.push(num);
                el.classList.add('selected');
            }
            
            statusVal.innerText = `${selectedNumbers.length} / ${maxPicks}`;
            updatePaytable();
            
            // Clean previous draw state
            document.querySelectorAll('.k-num').forEach(b => {
                b.classList.remove('drawn', 'matched');
            });
            tray.innerHTML = '';
            statusHeader.innerText = 'SELECTED';
            statusVal.style.color = 'var(--accent-gold)';
        }

        function clearSelection() {
            if (isDrawing) return;
            selectedNumbers = [];
            document.querySelectorAll('.k-num').forEach(b => b.classList.remove('selected', 'drawn', 'matched'));
            statusVal.innerText = `0 / ${maxPicks}`;
            updatePaytable();
            tray.innerHTML = '';
        }

        function updatePaytable() {
            const picks = selectedNumbers.length;
            if (picks === 0) {
                paytableEl.innerHTML = '<div class="pt-title">PAYTABLE</div><div style="text-align:center; font-size:12px; color:#888;">Select numbers to view payouts</div>';
                return;
            }

            let html = '<div class="pt-title">PAYTABLE</div>';
            const table = payoutMatrix[picks];
            
            // Render backwards (highest payout top)
            const keys = Object.keys(table).map(Number).sort((a,b)=>b-a);
            keys.forEach(hits => {
                html += `<div class="pt-row" id="pt-row-${hits}"><span class="pt-match">${hits} Hits</span><span class="pt-multi">${table[hits]}x</span></div>`;
            });
            paytableEl.innerHTML = html;
        }

        function startDraw() {
            const picksCount = selectedNumbers.length;
            if (picksCount === 0) return alert('Select at least 1 number!');
            
            const betAmt = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(betAmt) || betAmt <= 0) return alert('Invalid Bet Amount');
            if (betAmt > balance) return alert('Insufficient Balance');

            balance -= betAmt;
            balanceEl.innerText = balance.toFixed(2);
            
            isDrawing = true;
            btnDraw.disabled = true;
            tray.innerHTML = '';
            
            // Reset grid visuals (keep selection)
            document.querySelectorAll('.k-num').forEach(b => b.classList.remove('drawn', 'matched'));
            document.querySelectorAll('.pt-row').forEach(r => r.classList.remove('active'));

            statusHeader.innerText = 'DRAWING...';
            statusVal.innerText = '0 HITS';
            statusVal.style.color = '#fff';

            // Generate 10 unique winning numbers out of 40
            let winningNumbers = [];
            while (winningNumbers.length < totalDraws) {
                let r = Math.floor(Math.random() * 40) + 1;
                if (!winningNumbers.includes(r)) winningNumbers.push(r);
            }

            let hits = 0;
            let drawIndex = 0;

            const drawAnim = setInterval(() => {
                const num = winningNumbers[drawIndex];
                const isMatch = selectedNumbers.includes(num);
                
                // Add to tray
                const ball = document.createElement('div');
                ball.className = `drawn-ball ${isMatch ? 'matched' : ''}`;
                ball.innerText = num;
                tray.appendChild(ball);

                // Update Grid
                const gridCell = grid.children[num - 1];
                if (isMatch) {
                    gridCell.classList.add('matched');
                    hits++;
                    statusVal.innerText = `${hits} HITS`;
                } else {
                    gridCell.classList.add('drawn');
                }

                drawIndex++;
                if (drawIndex >= totalDraws) {
                    clearInterval(drawAnim);
                    resolveWin(hits, betAmt);
                }
            }, 300);
        }

        function resolveWin(hits, betAmt) {
            const picksCount = selectedNumbers.length;
            const table = payoutMatrix[picksCount];
            const multiplier = table[hits] || 0;

            if (multiplier > 0) {
                const win = betAmt * multiplier;
                balance += win;
                balanceEl.innerText = balance.toFixed(2);
                
                statusHeader.innerText = 'YOU WON!';
                statusVal.innerText = `₹${win.toFixed(2)}`;
                statusVal.style.color = 'var(--accent-green)';
                
                const activeRow = document.getElementById(`pt-row-${hits}`);
                if (activeRow) activeRow.classList.add('active');
            } else {
                statusHeader.innerText = 'ROUND OVER';
                statusVal.innerText = 'NO WIN';
                statusVal.style.color = '#e74c3c';
            }

            setTimeout(() => {
                isDrawing = false;
                btnDraw.disabled = false;
            }, 1000);
        }
    </script>
</body>
</html>
