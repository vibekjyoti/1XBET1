<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Vegas Craps</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-blue: #238cf5; --accent-red: #e6003d; --accent-gold: #f1c40f;
            --table-felt: #0b6623; --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 20; }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-blue); }

        .layout { display: flex; flex-direction: column; align-items: center; padding: 25px 15px; flex: 1; gap: 20px; }

        /* Craps Table Stage */
        .table { width: 100%; max-width: 800px; height: 260px; background: radial-gradient(ellipse at bottom, var(--table-felt) 0%, #063d15 100%); border-radius: 20px; border: 4px solid #b38c4b; box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; position: relative; }
        
        .table-logo { position: absolute; font-size: 40px; font-weight: 900; letter-spacing: 10px; color: rgba(255,255,255,0.1); }
        
        .dice-container { display: flex; gap: 20px; z-index: 5; }
        .die { width: 65px; height: 65px; background: #e6003d; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 35px; color: #fff; box-shadow: inset -2px -2px 10px rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.6); border: 1px solid #ff3366; transition: transform 0.2s; }
        .die.rolling { animation: tumble 0.2s infinite ease-in-out alternate; }
        @keyframes tumble { from { transform: rotate(-20deg) translateY(-10px); } to { transform: rotate(20deg) translateY(10px); } }

        .status-badge { position: absolute; top: 15px; background: rgba(0,0,0,0.8); padding: 8px 25px; border-radius: 20px; font-weight: 900; font-size: 15px; letter-spacing: 2px; color: var(--accent-gold); border: 1px solid var(--accent-gold); text-transform: uppercase; z-index: 10; }

        /* Betting Grid */
        .betting-board { display: flex; gap: 15px; width: 100%; max-width: 800px; }
        .bet-btn { flex: 1; background: var(--bg-panel); border: 2px solid var(--border-color); border-radius: 12px; padding: 25px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center; }
        .bet-btn:hover { background: #182c40; transform: translateY(-4px); }
        .bet-btn.selected { border-color: var(--accent-gold); box-shadow: 0 0 20px rgba(255,193,7,0.4); transform: scale(1.05); background: #132435; z-index: 2; }
        
        .bet-title { font-size: 18px; font-weight: 900; text-transform: uppercase; color: #fff; margin-bottom: 5px; }
        .bet-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; font-weight: bold; }
        .bet-payout { font-size: 14px; font-weight: bold; color: var(--accent-gold); }

        .chip-icon { position: absolute; top: -10px; right: -10px; width: 35px; height: 35px; background: radial-gradient(circle, #ffc107 0%, #e6a800 100%); border: 2px dashed #fff; border-radius: 50%; opacity: 0; transform: scale(0); transition: 0.3s; display: flex; justify-content: center; align-items: center; color: #000; font-size: 14px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .bet-btn.selected .chip-icon { opacity: 1; transform: scale(1); }

        /* Controls */
        .controls { display: flex; gap: 15px; width: 100%; max-width: 800px; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-roll { flex: 1; background: #28a745; color: white; font-size: 22px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 0 #1e7e34; transition: 0.1s; }
        .btn-roll:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-roll:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }

        @media (max-width: 768px) {
            .betting-board { flex-direction: column; }
            .bet-btn { padding: 15px; flex-direction: row; justify-content: space-between; }
            .bet-desc { margin-bottom: 0; }
            .controls { flex-direction: column; }
            .btn-roll { padding: 15px; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="header-right">
            <div class="wallet">₹ <span id="balance">10000.00</span></div>
        </div>
    </header>

    <div class="layout">
        
        <div class="table">
            <div class="table-logo">CRAPS</div>
            <div class="status-badge" id="statusBadge">PLACE YOUR BET</div>
            
            <div class="dice-container">
                <div class="die" id="die1">🎲</div>
                <div class="die" id="die2">🎲</div>
            </div>
        </div>

        <div class="betting-board">
            <div class="bet-btn" onclick="selectBet('PASS', 2, this)">
                <div class="chip-icon">✔</div>
                <div class="bet-title">PASS LINE</div>
                <div class="bet-desc">Wins on 7, 11 (Loses 2,3,12)</div>
                <div class="bet-payout">PAYS 2x</div>
            </div>
            <div class="bet-btn" onclick="selectBet('FIELD', 2, this)">
                <div class="chip-icon">✔</div>
                <div class="bet-title">FIELD</div>
                <div class="bet-desc">Wins on 2,3,4,9,10,11,12</div>
                <div class="bet-payout">PAYS 2x</div>
            </div>
            <div class="bet-btn" onclick="selectBet('ANY7', 5, this)">
                <div class="chip-icon">✔</div>
                <div class="bet-title">ANY 7</div>
                <div class="bet-desc">Wins exactly on 7</div>
                <div class="bet-payout">PAYS 5x</div>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>BET AMOUNT (₹)</label>
                <input type="number" id="betAmount" value="200" min="10">
            </div>
            <button class="btn-roll" id="btnRoll" onclick="rollCraps()">ROLL DICE</button>
        </div>

    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const statusBadge = document.getElementById('statusBadge');
        const btnRoll = document.getElementById('btnRoll');
        const d1 = document.getElementById('die1');
        const d2 = document.getElementById('die2');

        let balance = 10000.00;
        let selectedBet = null;
        let currentMultiplier = 0;
        let isRolling = false;

        const diceFaces = ['⚀','⚁','⚂','⚃','⚄','⚅'];

        function selectBet(bet, multi, el) {
            if (isRolling) return;
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedBet = bet;
            currentMultiplier = multi;
            statusBadge.innerText = `BET LOCKED: ${bet}`;
            statusBadge.style.color = '#fff';
        }

        function rollCraps() {
            if (!selectedBet) return alert('Select a betting zone first!');
            const betAmt = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(betAmt) || betAmt <= 0) return alert('Invalid Bet Amount');
            if (betAmt > balance) return alert('Insufficient Balance');

            balance -= betAmt;
            balanceEl.innerText = balance.toFixed(2);
            isRolling = true;
            btnRoll.disabled = true;

            statusBadge.innerText = 'ROLLING...';
            d1.classList.add('rolling');
            d2.classList.add('rolling');

            // Tumbling visual
            const tumbleInterval = setInterval(() => {
                d1.innerText = diceFaces[Math.floor(Math.random() * 6)];
                d2.innerText = diceFaces[Math.floor(Math.random() * 6)];
            }, 80);

            setTimeout(() => {
                clearInterval(tumbleInterval);
                d1.classList.remove('rolling');
                d2.classList.remove('rolling');

                // Determine results
                const r1 = Math.floor(Math.random() * 6) + 1;
                const r2 = Math.floor(Math.random() * 6) + 1;
                const sum = r1 + r2;

                d1.innerText = diceFaces[r1 - 1];
                d2.innerText = diceFaces[r2 - 1];

                // Single Roll Craps Evaluation
                let won = false;
                let push = false;

                if (selectedBet === 'PASS') {
                    if (sum === 7 || sum === 11) won = true;
                    else if (sum === 2 || sum === 3 || sum === 12) won = false; // Craps
                    else push = true; // Any point number pushes in this simplified rapid version
                } else if (selectedBet === 'FIELD') {
                    if ([2,3,4,9,10,11,12].includes(sum)) won = true;
                } else if (selectedBet === 'ANY7') {
                    if (sum === 7) won = true;
                }

                if (won) {
                    const winnings = betAmt * currentMultiplier;
                    balance += winnings;
                    balanceEl.innerText = balance.toFixed(2);
                    statusBadge.innerText = `SUM ${sum} • WON ₹${winnings.toFixed(2)}!`;
                    statusBadge.style.color = 'var(--accent-green)';
                } else if (push) {
                    balance += betAmt;
                    balanceEl.innerText = balance.toFixed(2);
                    statusBadge.innerText = `SUM ${sum} • PUSH (BET RETURNED)`;
                    statusBadge.style.color = '#fff';
                } else {
                    statusBadge.innerText = `SUM ${sum} • BET LOST.`;
                    statusBadge.style.color = 'var(--accent-red)';
                }

                setTimeout(() => {
                    isRolling = false;
                    btnRoll.disabled = false;
                    statusBadge.innerText = 'PLACE YOUR BET';
                    statusBadge.style.color = 'var(--accent-gold)';
                    document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
                    selectedBet = null;
                }, 3000);

            }, 1200);
        }
    </script>
</body>
</html>
