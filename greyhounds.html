<!-- Save this as greyhounds.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Greyhound Derby</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-green: #2ecc71; --accent-blue: #3498db; --accent-red: #e74c3c; --accent-gold: #f1c40f;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 20; }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-blue); }

        .layout { display: flex; flex-direction: column; align-items: center; padding: 25px 15px; flex: 1; gap: 20px; }

        /* Track Stage */
        .track-wrapper { width: 100%; max-width: 900px; background: #c28b50; border: 4px solid #fff; border-radius: 12px; position: relative; overflow: hidden; padding: 5px 0; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        
        .finish-line { position: absolute; top: 0; right: 40px; width: 15px; height: 100%; background: repeating-linear-gradient(0deg, #fff, #fff 15px, #d63031 15px, #d63031 30px); z-index: 5; box-shadow: -5px 0 15px rgba(0,0,0,0.3); }

        .lane { display: flex; align-items: center; height: 45px; border-bottom: 2px dashed rgba(255,255,255,0.4); position: relative; background: #a6723d; }
        .lane:last-child { border-bottom: none; }
        
        .dog { position: absolute; left: 10px; font-size: 32px; z-index: 10; transition: left 0.1s linear; display: flex; align-items: center; filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.5)); }
        
        /* Vest Numbers */
        .dog-vest { font-size: 12px; font-weight: 900; color: #fff; border-radius: 4px; width: 18px; height: 18px; display: flex; justify-content: center; align-items: center; position: absolute; left: -10px; top: 10px; z-index: 12; border: 1px solid #111; }
        
        .vest-1 { background: #e74c3c; } .vest-2 { background: #3498db; }
        .vest-3 { background: #f1c40f; color:#111; } .vest-4 { background: #9b59b6; }
        .vest-5 { background: #e67e22; } .vest-6 { background: #2ecc71; }

        .status-toast { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); padding: 15px 30px; border-radius: 30px; font-weight: 900; letter-spacing: 2px; font-size: 18px; color: var(--accent-gold); z-index: 20; text-align: center; border: 1px solid rgba(255,193,7,0.3); opacity: 0; transition: 0.3s; pointer-events: none; white-space: nowrap; }
        .status-toast.show { opacity: 1; }

        /* Betting Board */
        .betting-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 900px; }
        .bet-btn { background: var(--bg-panel); border: 2px solid var(--border-color); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .bet-btn:hover { background: #182c40; transform: translateY(-3px); }
        .bet-btn.selected { border-color: var(--accent-gold); transform: scale(1.05); background: #132435; z-index: 2; box-shadow: 0 0 20px rgba(255,193,7,0.4); }

        .bet-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .bet-title { font-size: 16px; font-weight: 900; text-transform: uppercase; color: #fff; }
        .bet-odds { font-size: 16px; color: var(--accent-gold); font-weight: 900; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 6px; }

        /* Controls */
        .controls { display: flex; gap: 15px; width: 100%; max-width: 900px; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-race { flex: 1; background: var(--accent-green); color: white; font-size: 20px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 0 #1e7e34; transition: 0.1s; }
        .btn-race:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-race:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        @media (max-width: 768px) {
            .betting-board { grid-template-columns: 1fr 1fr; }
            .controls { flex-direction: column; }
            .btn-race { padding: 15px; width: 100%; }
            .dog { font-size: 26px; }
            .lane { height: 38px; }
            .dog-vest { width: 14px; height: 14px; font-size: 10px; top: 8px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="header-right">
            <div class="wallet">₹ <span id="balance">10000.00</span></div>
            <button class="close-btn" onclick="window.location.href='index.html'">HUB</button>
        </div>
    </header>

    <div class="layout">
        <div class="track-wrapper" id="track">
            <div class="finish-line"></div>
            <div class="status-toast" id="statusToast">SELECT A HOUND</div>

            <div class="lane"><div class="dog" id="dog-1"><div class="dog-vest vest-1">1</div>🐕</div></div>
            <div class="lane"><div class="dog" id="dog-2"><div class="dog-vest vest-2">2</div>🐕</div></div>
            <div class="lane"><div class="dog" id="dog-3"><div class="dog-vest vest-3">3</div>🐕</div></div>
            <div class="lane"><div class="dog" id="dog-4"><div class="dog-vest vest-4">4</div>🐕</div></div>
            <div class="lane"><div class="dog" id="dog-5"><div class="dog-vest vest-5">5</div>🐕</div></div>
            <div class="lane"><div class="dog" id="dog-6"><div class="dog-vest vest-6">6</div>🐕</div></div>
        </div>

        <!-- Dynamic Odds Board to simulate varying probabilities -->
        <div class="betting-board">
            <div class="bet-btn" onclick="selectDog(1, 3.2, this)">
                <div class="bet-header"><div class="dog-vest vest-1" style="position:static;">1</div> <div class="bet-title">HOUND 1</div></div>
                <div class="bet-odds">3.20x</div>
            </div>
            <div class="bet-btn" onclick="selectDog(2, 4.5, this)">
                <div class="bet-header"><div class="dog-vest vest-2" style="position:static;">2</div> <div class="bet-title">HOUND 2</div></div>
                <div class="bet-odds">4.50x</div>
            </div>
            <div class="bet-btn" onclick="selectDog(3, 5.0, this)">
                <div class="bet-header"><div class="dog-vest vest-3" style="position:static;">3</div> <div class="bet-title">HOUND 3</div></div>
                <div class="bet-odds">5.00x</div>
            </div>
            <div class="bet-btn" onclick="selectDog(4, 6.5, this)">
                <div class="bet-header"><div class="dog-vest vest-4" style="position:static;">4</div> <div class="bet-title">HOUND 4</div></div>
                <div class="bet-odds">6.50x</div>
            </div>
            <div class="bet-btn" onclick="selectDog(5, 8.0, this)">
                <div class="bet-header"><div class="dog-vest vest-5" style="position:static;">5</div> <div class="bet-title">HOUND 5</div></div>
                <div class="bet-odds">8.00x</div>
            </div>
            <div class="bet-btn" onclick="selectDog(6, 12.0, this)">
                <div class="bet-header"><div class="dog-vest vest-6" style="position:static;">6</div> <div class="bet-title">HOUND 6</div></div>
                <div class="bet-odds">12.00x</div>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>BET AMOUNT (₹)</label>
                <input type="number" id="betAmount" value="200" min="10">
            </div>
            <button class="btn-race" id="btnRace" onclick="startRace()">START RACE</button>
        </div>
    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const btnRace = document.getElementById('btnRace');
        const statusToast = document.getElementById('statusToast');
        const track = document.getElementById('track');
        
        let balance = 10000.00;
        let selectedDog = null;
        let isRacing = false;
        let currentMultiplier = 0;

        // Dog setup with slight speed weights corresponding to odds
        const dogs = [
            { el: document.getElementById('dog-1'), id: 1, pos: 10, baseSpeed: 1.15 }, // 3.20x (Favorite)
            { el: document.getElementById('dog-2'), id: 2, pos: 10, baseSpeed: 1.05 }, // 4.50x
            { el: document.getElementById('dog-3'), id: 3, pos: 10, baseSpeed: 1.00 }, // 5.00x
            { el: document.getElementById('dog-4'), id: 4, pos: 10, baseSpeed: 0.95 }, // 6.50x
            { el: document.getElementById('dog-5'), id: 5, pos: 10, baseSpeed: 0.85 }, // 8.00x
            { el: document.getElementById('dog-6'), id: 6, pos: 10, baseSpeed: 0.70 }  // 12.00x (Underdog)
        ];

        function selectDog(id, multi, el) {
            if (isRacing) return;
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedDog = id;
            currentMultiplier = multi;
        }

        function startRace() {
            if (!selectedDog) return alert('Select a hound to bet on!');
            const betAmt = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(betAmt) || betAmt <= 0) return alert('Invalid Bet');
            if (betAmt > balance) return alert('Insufficient Balance');

            balance -= betAmt;
            balanceEl.innerText = balance.toFixed(2);
            isRacing = true;
            btnRace.disabled = true;

            dogs.forEach(d => {
                d.pos = 10;
                d.el.style.left = d.pos + 'px';
            });
            statusToast.classList.remove('show');

            const trackWidth = track.clientWidth - 50; 
            let winner = null;

            function raceLoop() {
                let raceOver = false;
                
                dogs.forEach(d => {
                    // Random speed burst + base speed weight
                    const burst = Math.random() * 3.5; 
                    d.pos += (burst * d.baseSpeed);
                    d.el.style.left = d.pos + 'px';

                    if (d.pos >= trackWidth && !raceOver) {
                        raceOver = true;
                        winner = d.id;
                    }
                });

                if (raceOver) resolveRace(winner, betAmt);
                else requestAnimationFrame(raceLoop);
            }
            requestAnimationFrame(raceLoop);
        }

        function resolveRace(winnerId, betAmt) {
            let msg = '';
            if (winnerId === selectedDog) {
                const win = betAmt * currentMultiplier;
                balance += win;
                balanceEl.innerText = balance.toFixed(2);
                msg = `HOUND ${winnerId} WINS! PAYS ₹${win.toFixed(2)}`;
                statusToast.style.color = 'var(--accent-green)';
                statusToast.style.borderColor = 'var(--accent-green)';
            } else {
                msg = `HOUND ${winnerId} WINS. BET LOST.`;
                statusToast.style.color = 'var(--accent-red)';
                statusToast.style.borderColor = 'var(--accent-red)';
            }

            statusToast.innerText = msg;
            statusToast.classList.add('show');

            setTimeout(() => {
                isRacing = false;
                btnRace.disabled = false;
                document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
                selectedDog = null;
                statusToast.classList.remove('show');
                dogs.forEach(d => { d.pos = 10; d.el.style.left = '10px'; });
            }, 3500);
        }
    </script>
</body>
</html>
