<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Virtual Sabong</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --meron: #e6003d; --wala: #238cf5; --tie: #2ecc71; --accent-gold: #f1c40f;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 20; }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-blue); }

        .layout { display: flex; flex-direction: column; align-items: center; padding: 25px 15px; flex: 1; gap: 20px; max-width: 800px; margin: auto; width: 100%; }

        /* Arena Stage */
        .arena { width: 100%; height: 260px; background: radial-gradient(ellipse at center, #7a5e3d 0%, #3d2a15 100%); border-radius: 16px; border: 4px solid #b38c4b; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        
        .status-badge { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 8px 25px; border-radius: 20px; font-weight: 900; font-size: 15px; letter-spacing: 2px; color: var(--accent-gold); border: 1px solid rgba(255,193,7,0.3); z-index: 10; text-transform: uppercase; }

        /* Fighters */
        .fighter-container { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 120px; z-index: 5; }
        
        .health-bar { width: 100%; height: 10px; background: #111; border-radius: 5px; border: 1px solid #444; overflow: hidden; }
        .health-fill { height: 100%; width: 100%; background: var(--accent-green); transition: width 0.3s; }
        
        .rooster { font-size: 80px; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 10px 5px rgba(0,0,0,0.5)); }
        
        /* Attack Animations */
        .attacking-right { transform: translateX(80px) rotate(15deg); }
        .attacking-left { transform: translateX(-80px) rotate(-15deg); }
        .hit { filter: grayscale(100%) sepia(1) hue-rotate(-50deg) saturate(5) drop-shadow(0 10px 5px rgba(0,0,0,0.5)); transform: translateY(-10px) rotate(-5deg); }
        .dead { transform: rotate(90deg) scale(0.8); filter: grayscale(100%); opacity: 0.5; }

        /* Flip Wala (Right side) so they face each other */
        #walaRooster { transform: scaleX(-1); }
        #walaRooster.attacking-left { transform: scaleX(-1) translateX(80px) rotate(15deg); }
        #walaRooster.hit { transform: scaleX(-1) translateY(-10px) rotate(-5deg); }
        #walaRooster.dead { transform: scaleX(-1) rotate(90deg) scale(0.8); }

        .vs-text { font-size: 35px; font-weight: 900; color: rgba(255,255,255,0.2); font-style: italic; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

        /* Betting Board */
        .betting-board { display: flex; gap: 15px; width: 100%; }
        .bet-btn { flex: 1; background: var(--bg-panel); border: 2px solid var(--border-color); border-radius: 12px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; }
        .bet-btn:hover { background: #182c40; transform: translateY(-3px); }
        .bet-btn.selected { border-color: #fff; transform: scale(1.05); z-index: 2; box-shadow: 0 0 20px rgba(255,255,255,0.3); }

        .bet-title { font-size: 20px; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
        .btn-meron .bet-title { color: var(--meron); }
        .btn-wala .bet-title { color: var(--wala); }
        .btn-tie .bet-title { color: var(--tie); }
        .payout { font-size: 13px; color: var(--text-muted); font-weight: bold; }

        .controls { display: flex; gap: 15px; width: 100%; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-action { flex: 1; background: var(--accent-gold); color: #111; font-size: 20px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #b9770e; transition: 0.1s; }
        .btn-action:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-action:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }

        @media (max-width: 768px) {
            .arena { padding: 0 20px; height: 220px; }
            .rooster { font-size: 60px; }
            .betting-board { flex-direction: column; gap: 10px; }
            .bet-btn { padding: 15px; flex-direction: row; justify-content: space-between; }
            .controls { flex-direction: column; padding: 15px; }
            .btn-action { padding: 15px; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="wallet">₹ <span id="balance">10000.00</span></div>
    </header>

    <div class="layout">
        
        <div class="arena">
            <div class="status-badge" id="statusBadge">PLACE YOUR BETS</div>
            
            <div class="fighter-container">
                <div class="health-bar"><div class="health-fill" id="hpMeron"></div></div>
                <div class="rooster" id="meronRooster">🐓</div>
            </div>

            <div class="vs-text">VS</div>

            <div class="fighter-container">
                <div class="health-bar"><div class="health-fill" id="hpWala"></div></div>
                <div class="rooster" id="walaRooster">🐓</div>
            </div>
        </div>

        <div class="betting-board">
            <div class="bet-btn btn-meron" onclick="selectBet('MERON', 1.90, this)">
                <div class="bet-title">MERON (RED)</div>
                <div class="payout">PAYS 1.90x</div>
            </div>
            <div class="bet-btn btn-tie" onclick="selectBet('TIE', 8, this)">
                <div class="bet-title">DRAW</div>
                <div class="payout">PAYS 8.00x</div>
            </div>
            <div class="bet-btn btn-wala" onclick="selectBet('WALA', 1.95, this)">
                <div class="bet-title">WALA (BLUE)</div>
                <div class="payout">PAYS 1.95x</div>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>BET AMOUNT (₹)</label>
                <input type="number" id="betAmount" value="500" min="50">
            </div>
            <button class="btn-action" id="btnFight" onclick="startFight()">START FIGHT</button>
        </div>

    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const statusBadge = document.getElementById('statusBadge');
        const btnFight = document.getElementById('btnFight');
        
        const meron = document.getElementById('meronRooster');
        const wala = document.getElementById('walaRooster');
        const hpMeron = document.getElementById('hpMeron');
        const hpWala = document.getElementById('hpWala');

        let balance = 10000.00;
        let selectedBet = null;
        let currentMulti = 0;
        let isFighting = false;

        function selectBet(side, multi, el) {
            if (isFighting) return;
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedBet = side;
            currentMulti = multi;
            statusBadge.innerText = `BET LOCKED: ${side}`;
        }

        function resetFighters() {
            meron.className = 'rooster';
            wala.className = 'rooster';
            hpMeron.style.width = '100%';
            hpWala.style.width = '100%';
        }

        function startFight() {
            if (!selectedBet) return alert('Select Meron, Wala, or Draw!');
            const betAmt = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(betAmt) || betAmt <= 0) return alert('Invalid Bet Amount');
            if (betAmt > balance) return alert('Insufficient Balance');

            balance -= betAmt;
            balanceEl.innerText = balance.toFixed(2);
            isFighting = true;
            btnFight.disabled = true;

            resetFighters();
            statusBadge.innerText = 'FIGHT!';
            statusBadge.style.color = '#fff';

            let h1 = 100, h2 = 100;
            
            // Fixed odds probability setup for UI mockup
            const r = Math.random();
            let winnerStr = 'MERON';
            if (r > 0.45 && r < 0.95) winnerStr = 'WALA';
            if (r >= 0.95) winnerStr = 'TIE';

            let rounds = 0;
            const fightInterval = setInterval(() => {
                rounds++;
                
                // Random attack sequence
                const attacker = Math.random() > 0.5 ? 'MERON' : 'WALA';
                const damage = Math.floor(Math.random() * 25) + 15;

                if (attacker === 'MERON') {
                    meron.classList.add('attacking-right');
                    setTimeout(() => {
                        meron.classList.remove('attacking-right');
                        wala.classList.add('hit');
                        h2 = Math.max(0, h2 - damage);
                        hpWala.style.width = `${h2}%`;
                        setTimeout(() => wala.classList.remove('hit'), 200);
                    }, 200);
                } else {
                    wala.classList.add('attacking-left');
                    setTimeout(() => {
                        wala.classList.remove('attacking-left');
                        meron.classList.add('hit');
                        h1 = Math.max(0, h1 - damage);
                        hpMeron.style.width = `${h1}%`;
                        setTimeout(() => meron.classList.remove('hit'), 200);
                    }, 200);
                }

                // Force deterministic outcome based on random setup
                if (rounds >= 4) {
                    if (winnerStr === 'MERON') { h1 = Math.max(h1, 10); h2 = 0; }
                    else if (winnerStr === 'WALA') { h2 = Math.max(h2, 10); h1 = 0; }
                    else { h1 = 0; h2 = 0; } // Tie

                    hpMeron.style.width = `${h1}%`;
                    hpWala.style.width = `${h2}%`;

                    clearInterval(fightInterval);

                    setTimeout(() => {
                        if (h1 === 0 && h2 > 0) meron.classList.add('dead');
                        if (h2 === 0 && h1 > 0) wala.classList.add('dead');
                        if (h1 === 0 && h2 === 0) { meron.classList.add('dead'); wala.classList.add('dead'); }
                        
                        resolveFight(winnerStr, betAmt);
                    }, 500);
                }
            }, 800);
        }

        function resolveFight(winner, betAmt) {
            if (winner === selectedBet) {
                const win = betAmt * currentMulti;
                balance += win;
                balanceEl.innerText = balance.toFixed(2);
                statusBadge.innerText = `${winner} WINS! WON ₹${win.toFixed(2)}`;
                statusBadge.style.color = 'var(--accent-green)';
            } else {
                statusBadge.innerText = `${winner} WINS. BET LOST.`;
                statusBadge.style.color = 'var(--accent-red)';
            }

            setTimeout(() => {
                isFighting = false;
                btnFight.disabled = false;
                statusBadge.innerText = 'PLACE YOUR BETS';
                statusBadge.style.color = 'var(--accent-gold)';
                document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
                selectedBet = null;
                resetFighters();
            }, 3500);
        }
    </script>
</body>
</html>
