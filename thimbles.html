<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Thimbles</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-green: #28a745; --accent-blue: #238cf5; --accent-wood: #d35400;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-blue); }

        .layout { display: flex; flex-direction: column; align-items: center; padding: 40px 15px; flex: 1; gap: 20px; }

        /* Stage */
        .stage { width: 100%; max-width: 700px; height: 300px; background: radial-gradient(ellipse at bottom, #2b1d14 0%, #110905 100%); border-radius: 20px; border: 4px solid #5c3a21; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        
        .status-msg { position: absolute; top: 20px; font-size: 16px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #ffc107; background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(255,193,7,0.3); }

        .cups-container { display: flex; justify-content: center; align-items: flex-end; gap: 40px; height: 120px; position: relative; width: 100%; }
        
        /* The Ball */
        .ball { width: 30px; height: 30px; background: radial-gradient(circle at top left, #fff, #999); border-radius: 50%; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); box-shadow: inset -5px -5px 10px rgba(0,0,0,0.5), 0 10px 10px rgba(0,0,0,0.6); opacity: 0; transition: 0.3s; z-index: 1; }

        /* The Cups */
        .cup-wrapper { position: relative; width: 80px; height: 100px; z-index: 5; cursor: pointer; transition: transform 0.4s ease-in-out; }
        
        .cup { width: 100%; height: 100%; background: linear-gradient(135deg, #e67e22, #d35400); border-radius: 10px 10px 5px 5px; position: relative; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.4), 0 15px 15px rgba(0,0,0,0.5); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .cup::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 15px; background: #8e44ad; border-radius: 50%; background: #873e23; box-shadow: inset 0 -2px 5px rgba(0,0,0,0.5); z-index: -1; }
        
        /* Reveal Animation */
        .cup-wrapper.lifted .cup { transform: translateY(-70px); box-shadow: inset -10px -10px 20px rgba(0,0,0,0.4), 0 60px 20px rgba(0,0,0,0.2); }

        /* Controls */
        .controls { display: flex; gap: 15px; width: 100%; max-width: 700px; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-play { flex: 1; background: var(--accent-green); color: white; font-size: 20px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #1e7e34; transition: 0.1s; }
        .btn-play:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-play:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }

        @media (max-width: 768px) {
            .cups-container { gap: 20px; }
            .cup-wrapper { width: 70px; height: 90px; }
            .controls { flex-direction: column; }
            .btn-play { padding: 15px; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="header-right">
            <div class="wallet">₹ <span id="balance">10000.00</span></div>
        </div>
    </header>

    <div class="layout">
        
        <div class="stage">
            <div class="status-msg" id="statusMsg">PLACE YOUR BET</div>
            
            <div class="cups-container" id="cupsContainer">
                <div class="ball" id="ball"></div>
                <div class="cup-wrapper" id="cup0" onclick="chooseCup(0)">
                    <div class="cup"></div>
                </div>
                <div class="cup-wrapper" id="cup1" onclick="chooseCup(1)">
                    <div class="cup"></div>
                </div>
                <div class="cup-wrapper" id="cup2" onclick="chooseCup(2)">
                    <div class="cup"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>BET AMOUNT (₹)</label>
                <input type="number" id="betAmount" value="200" min="10">
            </div>
            <button class="btn-play" id="btnPlay" onclick="startGame()">SHUFFLE CUPS (PAYS 2.88x)</button>
        </div>

    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const statusMsg = document.getElementById('statusMsg');
        const btnPlay = document.getElementById('btnPlay');
        const ball = document.getElementById('ball');
        const cups = [document.getElementById('cup0'), document.getElementById('cup1'), document.getElementById('cup2')];
        const container = document.getElementById('cupsContainer');

        let balance = 10000.00;
        let isShuffling = false;
        let canChoose = false;
        let ballIndex = 1; // Start middle
        let currentBet = 0;

        // Positioning map for CSS transforms
        const posMap = [
            { x: -120 }, { x: 0 }, { x: 120 }
        ];

        // Ensure proper gap scaling on mobile
        function getPositions() {
            const gap = window.innerWidth < 768 ? 90 : 120;
            return [{ x: -gap }, { x: 0 }, { x: gap }];
        }

        // Init positions
        function resetPositions() {
            const p = getPositions();
            cups[0].style.transform = `translateX(${p[0].x}px)`;
            cups[1].style.transform = `translateX(${p[1].x}px)`;
            cups[2].style.transform = `translateX(${p[2].x}px)`;
            // Ball under middle
            ball.style.transform = `translateX(${p[1].x}px)`;
        }
        resetPositions();
        window.addEventListener('resize', resetPositions);

        function startGame() {
            const amt = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(amt) || amt <= 0) return alert('Invalid Bet Amount');
            if (amt > balance) return alert('Insufficient Balance');

            balance -= amt;
            currentBet = amt;
            balanceEl.innerText = balance.toFixed(2);
            
            isShuffling = true;
            canChoose = false;
            btnPlay.disabled = true;
            
            cups.forEach(c => c.classList.remove('lifted'));
            statusMsg.innerText = 'SHUFFLING...';
            statusMsg.style.color = '#fff';

            // Briefly show ball then cover
            const p = getPositions();
            ball.style.transform = `translateX(${p[ballIndex].x}px)`;
            ball.style.opacity = '1';
            cups[ballIndex].classList.add('lifted');

            setTimeout(() => {
                cups[ballIndex].classList.remove('lifted');
                ball.style.opacity = '0';
                
                // Start shuffle animation
                setTimeout(shuffleLogic, 500);
            }, 800);
        }

        function shuffleLogic() {
            const p = getPositions();
            let shuffles = 0;
            let currentPositions = [0, 1, 2]; // Tracks which cup is where

            const shuffleInterval = setInterval(() => {
                // Pick 2 random distinct indices to swap
                let idxA = Math.floor(Math.random() * 3);
                let idxB = Math.floor(Math.random() * 3);
                while (idxA === idxB) {
                    idxB = Math.floor(Math.random() * 3);
                }

                // Swap in logical array
                [currentPositions[idxA], currentPositions[idxB]] = [currentPositions[idxB], currentPositions[idxA]];

                // Apply CSS Transforms based on logical array
                cups[0].style.transform = `translateX(${p[currentPositions.indexOf(0)].x}px)`;
                cups[1].style.transform = `translateX(${p[currentPositions.indexOf(1)].x}px)`;
                cups[2].style.transform = `translateX(${p[currentPositions.indexOf(2)].x}px)`;

                shuffles++;
                if (shuffles >= 10) {
                    clearInterval(shuffleInterval);
                    setTimeout(() => {
                        // The ball moves with its original cup
                        const finalBallSlot = currentPositions.indexOf(ballIndex);
                        ball.style.transform = `translateX(${p[finalBallSlot].x}px)`;
                        
                        isShuffling = false;
                        canChoose = true;
                        statusMsg.innerText = 'WHERE IS THE BALL?';
                        statusMsg.style.color = '#ffc107';
                    }, 500);
                }
            }, 300);
        }

        function chooseCup(idx) {
            if (!canChoose) return;
            canChoose = false;
            
            cups[idx].classList.add('lifted');
            
            // Show the ball if it's there
            ball.style.opacity = '1';

            setTimeout(() => {
                if (idx === ballIndex) {
                    const win = currentBet * 2.88;
                    balance += win;
                    balanceEl.innerText = balance.toFixed(2);
                    statusMsg.innerText = `YOU FOUND IT! WON ₹${win.toFixed(2)}`;
                    statusMsg.style.color = '#28a745';
                } else {
                    statusMsg.innerText = 'EMPTY! BET LOST.';
                    statusMsg.style.color = '#e6003d';
                    
                    // Reveal where it actually was
                    setTimeout(() => {
                        cups[ballIndex].classList.add('lifted');
                    }, 500);
                }

                setTimeout(() => {
                    btnPlay.disabled = false;
                    cups.forEach(c => c.classList.remove('lifted'));
                    ball.style.opacity = '0';
                    statusMsg.innerText = 'PLACE YOUR BET';
                    statusMsg.style.color = '#ffc107';
                }, 3000);

            }, 400);
        }
    </script>
</body>
</html>
