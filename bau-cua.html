<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Fish Prawn Crab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-blue: #238cf5; --accent-red: #e6003d; --accent-gold: #ffc107; --accent-green: #28a745;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-blue); }

        .layout { display: flex; flex-direction: column; align-items: center; padding: 25px 15px; flex: 1; gap: 20px; }

        /* Wooden Plate Area */
        .stage { width: 100%; max-width: 800px; height: 260px; background: radial-gradient(ellipse at center, #8e44ad 0%, #2c0e3d 100%); border-radius: 16px; border: 4px solid #b38c4b; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        
        .plate { width: 180px; height: 180px; background: radial-gradient(circle at center, #f5cd79, #c44569); border-radius: 50%; display: flex; justify-content: center; align-items: center; gap: 15px; box-shadow: inset 0 5px 15px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.8); padding: 20px; border: 4px solid #e77f67; position: relative; z-index: 5; }

        .die { width: 45px; height: 45px; background: #fff; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 28px; box-shadow: inset -2px -3px 8px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.6); transition: transform 0.1s; border: 1px solid #ccc; }
        
        .plate.shaking .die { animation: bounceDie 0.15s infinite alternate; }
        @keyframes bounceDie { from { transform: translateY(-10px) rotate(-15deg); } to { transform: translateY(10px) rotate(15deg); } }

        .status-badge { position: absolute; top: 15px; font-size: 14px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-gold); background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(255,193,7,0.3); z-index: 10; }

        /* Betting Grid */
        .betting-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 800px; }
        .bet-btn { background: var(--bg-panel); border: 2px solid var(--border-color); border-radius: 12px; padding: 15px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .bet-btn:hover { transform: translateY(-4px); background: #182c40; }
        .bet-btn.selected { border-color: var(--accent-gold); box-shadow: 0 0 20px rgba(255,193,7,0.4); transform: scale(1.05); background: #132435; z-index: 2; }
        
        .symbol-icon { font-size: 45px; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5)); margin-bottom: 5px; }
        .bet-title { font-size: 16px; font-weight: 900; text-transform: uppercase; color: #fff; }
        .bet-payout { font-size: 11px; color: var(--text-muted); font-weight: bold; margin-top: 2px; }
        
        .chip-icon { position: absolute; top: -10px; right: -10px; width: 35px; height: 35px; background: radial-gradient(circle, #ffc107 0%, #e6a800 100%); border: 2px dashed #fff; border-radius: 50%; opacity: 0; transform: scale(0); transition: 0.3s; display: flex; justify-content: center; align-items: center; color: #000; font-size: 14px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .bet-btn.selected .chip-icon { opacity: 1; transform: scale(1); }

        /* Controls */
        .controls { display: flex; gap: 15px; width: 100%; max-width: 800px; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-action { flex: 1; background: var(--accent-green); color: white; font-size: 20px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 0 #1e7e34; transition: 0.1s; }
        .btn-action:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-action:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }

        @media (max-width: 768px) {
            .betting-board { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stage { height: 240px; }
            .controls { flex-direction: column; padding: 15px; }
            .btn-action { padding: 15px; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="header-right">
            <div class="wallet">₹ <span id="balance">10000.00</span></div>
            <button class="close-btn" onclick="window.location.href='index.html'">HUB</button>
        </div>
    </header>

    <div class="layout">
        
        <div class="stage">
            <div class="status-badge" id="statusBadge">PLACE YOUR BET</div>
            
            <div class="plate" id="plate">
                <div class="die" id="d1">🏺</div>
                <div class="die" id="d2">🦀</div>
                <div class="die" id="d3">🐟</div>
            </div>
        </div>

        <div class="betting-board">
            <div class="bet-btn" onclick="selectSymbol('GOURD', this)">
                <div class="chip-icon">✔</div>
                <div class="symbol-icon">🏺</div>
                <div class="bet-title">GOURD</div>
                <div class="bet-payout">1x to 3x</div>
            </div>
            <div class="bet-btn" onclick="selectSymbol('CRAB', this)">
                <div class="chip-icon">✔</div>
                <div class="symbol-icon">🦀</div>
                <div class="bet-title">CRAB</div>
                <div class="bet-payout">1x to 3x</div>
            </div>
            <div class="bet-btn" onclick="selectSymbol('FISH', this)">
                <div class="chip-icon">✔</div>
                <div class="symbol-icon">🐟</div>
                <div class="bet-title">FISH</div>
                <div class="bet-payout">1x to 3x</div>
            </div>
            <div class="bet-btn" onclick="selectSymbol('ROOSTER', this)">
                <div class="chip-icon">✔</div>
                <div class="symbol-icon">🐓</div>
                <div class="bet-title">ROOSTER</div>
                <div class="bet-payout">1x to 3x</div>
            </div>
            <div class="bet-btn" onclick="selectSymbol('PRAWN', this)">
                <div class="chip-icon">✔</div>
                <div class="symbol-icon">🦐</div>
                <div class="bet-title">PRAWN</div>
                <div class="bet-payout">1x to 3x</div>
            </div>
            <div class="bet-btn" onclick="selectSymbol('STAG', this)">
                <div class="chip-icon">✔</div>
                <div class="symbol-icon">🦌</div>
                <div class="bet-title">STAG</div>
                <div class="bet-payout">1x to 3x</div>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>BET AMOUNT (₹)</label>
                <input type="number" id="betAmount" value="100" min="10">
            </div>
            <button class="btn-action" id="btnRoll" onclick="rollDice()">SHAKE PLATE</button>
        </div>

    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const statusBadge = document.getElementById('statusBadge');
        const btnRoll = document.getElementById('btnRoll');
        const plate = document.getElementById('plate');
        const dice = [document.getElementById('d1'), document.getElementById('d2'), document.getElementById('d3')];

        let balance = 10000.00;
        let selectedSymbol = null;
        let isRolling = false;

        const symbols = [
            { id: 'GOURD', icon: '🏺' },
            { id: 'CRAB', icon: '🦀' },
            { id: 'FISH', icon: '🐟' },
            { id: 'ROOSTER', icon: '🐓' },
            { id: 'PRAWN', icon: '🦐' },
            { id: 'STAG', icon: '🦌' }
        ];

        function selectSymbol(id, el) {
            if (isRolling) return;
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedSymbol = id;
            statusBadge.innerText = `BET LOCKED: ${id}`;
            statusBadge.style.color = '#fff';
        }

        function rollDice() {
            if (!selectedSymbol) return alert('Select a symbol to bet on!');
            const betAmt = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(betAmt) || betAmt <= 0) return alert('Invalid Bet');
            if (betAmt > balance) return alert('Insufficient Balance');

            balance -= betAmt;
            balanceEl.innerText = balance.toFixed(2);
            isRolling = true;
            btnRoll.disabled = true;

            statusBadge.innerText = 'SHAKING...';
            statusBadge.style.color = 'var(--accent-gold)';
            plate.classList.add('shaking');

            // Tumbling visual
            const tumbleInterval = setInterval(() => {
                dice.forEach(die => {
                    const r = Math.floor(Math.random() * 6);
                    die.innerText = symbols[r].icon;
                });
            }, 80);

            setTimeout(() => {
                clearInterval(tumbleInterval);
                plate.classList.remove('shaking');

                // Determine results
                let matchCount = 0;
                const results = [];

                dice.forEach(die => {
                    const r = Math.floor(Math.random() * 6);
                    const sym = symbols[r];
                    results.push(sym.id);
                    die.innerText = sym.icon;
                    if (sym.id === selectedSymbol) matchCount++;
                });

                // Payouts: 1 match = 1:1 (+ original bet back)
                // 2 matches = 2:1 (+ original bet back)
                // 3 matches = 3:1 (+ original bet back)
                if (matchCount > 0) {
                    const payoutMulti = matchCount + 1; // Includes original bet return
                    const win = betAmt * payoutMulti;
                    balance += win;
                    balanceEl.innerText = balance.toFixed(2);
                    
                    statusBadge.innerText = `${matchCount} MATCHES! WON ₹${win.toFixed(2)}`;
                    statusBadge.style.color = 'var(--accent-green)';
                } else {
                    statusBadge.innerText = 'NO MATCHES. BET LOST.';
                    statusBadge.style.color = 'var(--accent-red)';
                }

                setTimeout(() => {
                    isRolling = false;
                    btnRoll.disabled = false;
                    statusBadge.innerText = 'PLACE YOUR BET';
                    statusBadge.style.color = 'var(--accent-gold)';
                    document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
                    selectedSymbol = null;
                }, 3500);

            }, 2000);
        }
    </script>
</body>
</html>
