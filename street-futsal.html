<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Street Futsal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-yellow: #f1c40f; --accent-blue: #238cf5; --accent-red: #e74c3c;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-blue); }

        .layout { display: flex; flex-direction: column; align-items: center; padding: 25px 15px; flex: 1; gap: 20px; width: 100%; max-width: 800px; margin: auto; }

        /* Concrete Pitch */
        .pitch-container { width: 100%; height: 350px; background: linear-gradient(180deg, #34495e 0%, #7f8c8d 100%); border-radius: 16px; border: 4px solid #555; position: relative; display: flex; flex-direction: column; align-items: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        
        /* Chainlink Goal */
        .goal-net { position: absolute; top: 20px; width: 75%; height: 160px; border: 8px solid #bdc3c7; border-bottom: none; border-radius: 4px 4px 0 0; background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.4) 10px, rgba(0,0,0,0.4) 12px), repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(0,0,0,0.4) 10px, rgba(0,0,0,0.4) 12px); display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; z-index: 2; }
        
        .target-zone { display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .tire-target { width: 50px; height: 50px; border: 12px solid #222; border-radius: 50%; box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 5px 10px rgba(0,0,0,0.5); opacity: 0.5; transition: 0.2s; pointer-events: none; }
        .target-zone:hover .tire-target { opacity: 1; border-color: var(--accent-yellow); transform: scale(1.1); }
        .target-zone.locked { pointer-events: none; }

        .goalkeeper { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 80px; height: 100px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23e74c3c"><path d="M12 2C9.79 2 8 3.79 8 6s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 9c-2.67 0-8 1.34-8 4v3h16v-3c0-2.66-5.33-4-8-4z"/></svg>') no-repeat center bottom; background-size: contain; z-index: 3; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .ball { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%) scale(1); font-size: 35px; z-index: 4; transition: transform 0.4s ease-out; filter: drop-shadow(0 10px 5px rgba(0,0,0,0.5)); }
        
        .status-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 15px 30px; border-radius: 30px; font-weight: 900; font-size: 20px; text-transform: uppercase; z-index: 10; opacity: 0; transition: 0.3s; text-align: center; border: 2px solid; pointer-events: none; }

        .ladder { display: flex; gap: 8px; width: 100%; overflow-x: auto; background: var(--bg-panel); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        .step { flex: 1; min-width: 60px; text-align: center; padding: 10px 0; background: var(--bg-card); border-radius: 6px; font-weight: 900; font-size: 14px; color: var(--text-muted); transition: 0.3s; }
        .step.active { background: rgba(241,196,15,0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); transform: scale(1.05); }
        .step.passed { background: rgba(255,255,255,0.05); color: #fff; }

        .controls { display: flex; gap: 15px; width: 100%; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-action { flex: 1; font-size: 20px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: 0.1s; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        .btn-play { background: var(--accent-blue); color: white; }
        .btn-cashout { background: #2ecc71; color: #111; display: none; }
        .btn-action:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }

        @media (max-width: 768px) {
            .pitch-container { height: 300px; }
            .goal-net { height: 130px; }
            .tire-target { width: 35px; height: 35px; border-width: 8px; }
            .controls { flex-direction: column; }
            .btn-action { padding: 15px; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">1X<span>BET</span></div>
        <div class="wallet">₹ <span id="balance">10000.00</span></div>
    </header>

    <div class="layout">
        
        <div class="pitch-container">
            <div class="goal-net">
                <div class="target-zone locked" onclick="shoot(0, -150, -80)"><div class="tire-target"></div></div>
                <div class="target-zone locked" onclick="shoot(1, 0, -100)"><div class="tire-target"></div></div>
                <div class="target-zone locked" onclick="shoot(2, 150, -80)"><div class="tire-target"></div></div>
                <div class="target-zone locked" onclick="shoot(3, -130, -30)"><div class="tire-target"></div></div>
                <div class="target-zone locked" onclick="shoot(4, 0, -30)"><div class="tire-target"></div></div>
                <div class="target-zone locked" onclick="shoot(5, 130, -30)"><div class="tire-target"></div></div>
            </div>

            <div class="goalkeeper" id="gk"></div>
            <div class="ball" id="ball">⚽</div>
            <div class="status-msg" id="statusMsg"></div>
        </div>

        <div class="ladder" id="ladder">
            <div class="step">1.5x</div>
            <div class="step">2.5x</div>
            <div class="step">4.0x</div>
            <div class="step">8.0x</div>
            <div class="step">20.0x</div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>BET AMOUNT (₹)</label>
                <input type="number" id="betAmount" value="200" min="10">
            </div>
            <button class="btn-action btn-play" id="btnPlay" onclick="startGame()">START STREET MATCH</button>
            <button class="btn-action btn-cashout" id="btnCashout" onclick="cashOut()">CASHOUT</button>
        </div>

    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const gk = document.getElementById('gk');
        const ball = document.getElementById('ball');
        const statusMsg = document.getElementById('statusMsg');
        const btnPlay = document.getElementById('btnPlay');
        const btnCashout = document.getElementById('btnCashout');
        const betInput = document.getElementById('betAmount');
        const zones = document.querySelectorAll('.target-zone');
        const steps = document.querySelectorAll('.step');

        let balance = 10000.00;
        let isPlaying = false;
        let currentStep = 0;
        let currentBet = 0;
        const multipliers = [1.5, 2.5, 4.0, 8.0, 20.0];

        // 6 Zones mapping for Goalkeeper dive translations
        const gkDives = [
            {x: -100, y: -40, rot: -30}, {x: 0, y: -60, rot: 0}, {x: 100, y: -40, rot: 30},
            {x: -120, y: 0, rot: -45},  {x: 0, y: 0, rot: 0},   {x: 120, y: 0, rot: 45}
        ];

        function startGame() {
            const amt = parseFloat(betInput.value);
            if (isNaN(amt) || amt <= 0) return alert('Invalid Bet Amount');
            if (amt > balance) return alert('Insufficient Balance');

            balance -= amt;
            currentBet = amt;
            balanceEl.innerText = balance.toFixed(2);
            
            isPlaying = true;
            currentStep = 0;
            
            btnPlay.style.display = 'none';
            btnCashout.style.display = 'block';
            btnCashout.disabled = true;
            betInput.disabled = true;

            resetPitch();
            zones.forEach(z => z.classList.remove('locked'));
            steps.forEach(s => s.className = 'step');
            steps[0].classList.add('active');

            showMsg('AIM FOR THE TIRE', '#f1c40f');
        }

        function resetPitch() {
            ball.style.transform = 'translateX(-50%) scale(1)';
            gk.style.transform = 'translateX(-50%) translateY(0) rotate(0deg)';
        }

        function showMsg(text, color) {
            statusMsg.innerText = text;
            statusMsg.style.color = color;
            statusMsg.style.borderColor = color;
            statusMsg.style.opacity = '1';
            setTimeout(() => { if (isPlaying) statusMsg.style.opacity = '0'; }, 1500);
        }

        function shoot(zoneIdx, ballX, ballY) {
            if (!isPlaying) return;
            zones.forEach(z => z.classList.add('locked'));
            btnCashout.disabled = true;

            // Kick animation
            ball.style.transform = `translate(calc(-50% + ${ballX}px), ${ballY}px) scale(0.6) rotate(720deg)`;

            // Save math (street futsal gets harder fast)
            const saveChance = 0.20 + (currentStep * 0.10); 
            const isSaved = Math.random() < saveChance;
            
            let gkTarget = zoneIdx;
            if (!isSaved) {
                let fakeDive = Math.floor(Math.random() * 6);
                while(fakeDive === zoneIdx) fakeDive = Math.floor(Math.random() * 6);
                gkTarget = fakeDive;
            }

            const dive = gkDives[gkTarget];
            gk.style.transform = `translate(calc(-50% + ${dive.x}px), ${dive.y}px) rotate(${dive.rot}deg)`;

            setTimeout(() => {
                if (isSaved) {
                    showMsg('BLOCKED! BET LOST', '#e74c3c');
                    setTimeout(() => endGame(false), 2000);
                } else {
                    showMsg('NICE SHOT!', '#2ecc71');
                    
                    const win = currentBet * multipliers[currentStep];
                    btnCashout.innerText = `CASHOUT (₹${win.toFixed(2)})`;
                    btnCashout.disabled = false;

                    steps[currentStep].classList.remove('active');
                    steps[currentStep].classList.add('passed');
                    
                    currentStep++;
                    if (currentStep >= multipliers.length) {
                        setTimeout(() => endGame(true), 1500);
                    } else {
                        steps[currentStep].classList.add('active');
                        setTimeout(() => {
                            resetPitch();
                            zones.forEach(z => z.classList.remove('locked'));
                        }, 1500);
                    }
                }
            }, 400);
        }

        function cashOut() {
            if (!isPlaying || currentStep === 0) return;
            endGame(true);
        }

        function endGame(won) {
            isPlaying = false;
            btnCashout.style.display = 'none';
            btnPlay.style.display = 'block';
            betInput.disabled = false;
            zones.forEach(z => z.classList.add('locked'));

            if (won) {
                const winAmt = currentBet * multipliers[currentStep - 1];
                balance += winAmt;
                balanceEl.innerText = balance.toFixed(2);
                showMsg(`WON ₹${winAmt.toFixed(2)}!`, '#f1c40f');
            }
            
            setTimeout(resetPitch, 1500);
        }
    </script>
</body>
</html>
