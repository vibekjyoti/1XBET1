<!-- Save this as chamber.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Russian Chamber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-red: #e74c3c; --accent-gold: #f1c40f; --accent-green: #2ecc71; --accent-blue: #238cf5;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 20; }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-blue); }

        .layout { display: flex; flex-direction: column; align-items: center; padding: 30px 15px; flex: 1; gap: 20px; }

        /* Revolver Cylinder Stage */
        .stage { width: 100%; max-width: 600px; height: 350px; background: radial-gradient(circle, #2a3138 0%, #0d1115 100%); border-radius: 20px; border: 2px solid #333; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 40px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
        
        .status-badge { position: absolute; top: 20px; font-size: 15px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--text-main); background: rgba(0,0,0,0.7); padding: 10px 25px; border-radius: 20px; border: 1px solid #555; z-index: 10; }

        .cylinder { width: 180px; height: 180px; background: radial-gradient(circle at center, #7f8c8d 0%, #2c3e50 100%); border-radius: 50%; border: 4px solid #111; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5); position: relative; transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1); }
        .cylinder.spinning { animation: spinFast 0.5s infinite linear; }
        @keyframes spinFast { 100% { transform: rotate(360deg); } }

        /* 6 Chambers */
        .chamber { width: 40px; height: 40px; background: #111; border-radius: 50%; position: absolute; box-shadow: inset 0 5px 10px rgba(0,0,0,0.9); border: 2px solid #555; transition: 0.3s; }
        
        /* Positioning logic for 6 holes */
        .c-0 { top: 10px; left: 70px; }
        .c-1 { top: 40px; right: 15px; }
        .c-2 { bottom: 40px; right: 15px; }
        .c-3 { bottom: 10px; left: 70px; }
        .c-4 { bottom: 40px; left: 15px; }
        .c-5 { top: 40px; left: 15px; }

        .chamber.safe { background: var(--accent-green); box-shadow: 0 0 15px var(--accent-green); border-color: #fff; }
        .chamber.dead { background: var(--accent-red); box-shadow: 0 0 20px var(--accent-red); border-color: #fff; }

        /* Paytable */
        .multiplier-ladder { display: flex; gap: 8px; width: 100%; max-width: 600px; background: var(--bg-panel); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); overflow-x: auto; }
        .step { flex: 1; text-align: center; padding: 10px 0; background: var(--bg-card); border-radius: 6px; font-weight: 900; font-size: 14px; color: var(--text-muted); border: 1px solid transparent; transition: 0.3s; }
        .step.active { background: rgba(46,204,113,0.2); color: var(--accent-green); border-color: var(--accent-green); transform: scale(1.05); box-shadow: 0 0 10px rgba(46,204,113,0.3); }
        .step.passed { background: rgba(255,255,255,0.05); color: #fff; }

        /* Controls */
        .controls { display: flex; gap: 15px; width: 100%; max-width: 600px; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-action { padding: 15px; font-size: 18px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.3); transition: 0.1s; }
        .btn-play { background: var(--accent-blue); color: white; flex: 1; }
        .btn-pull { background: var(--accent-red); color: white; flex: 1; display: none; }
        .btn-cashout { background: var(--accent-gold); color: #111; flex: 1; display: none; }
        .btn-action:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .btn-action { width: 100%; }
            .stage { height: 300px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="wallet">₹ <span id="balance">10000.00</span></div>
    </header>

    <div class="layout">
        
        <div class="stage">
            <div class="status-badge" id="statusBadge">SURVIVE 5 PULLS</div>
            
            <div class="cylinder" id="cylinder">
                <div class="chamber c-0" id="ch-0"></div>
                <div class="chamber c-1" id="ch-1"></div>
                <div class="chamber c-2" id="ch-2"></div>
                <div class="chamber c-3" id="ch-3"></div>
                <div class="chamber c-4" id="ch-4"></div>
                <div class="chamber c-5" id="ch-5"></div>
            </div>
        </div>

        <div class="multiplier-ladder" id="ladder">
            <div class="step" id="step-1">1.2x</div>
            <div class="step" id="step-2">1.5x</div>
            <div class="step" id="step-3">2.4x</div>
            <div class="step" id="step-4">5.0x</div>
            <div class="step" id="step-5">25.0x</div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>BET AMOUNT (₹)</label>
                <input type="number" id="betAmount" value="100" min="10">
            </div>
            <button class="btn-action btn-play" id="btnPlay" onclick="startGame()">LOAD & SPIN</button>
            <button class="btn-action btn-pull" id="btnPull" onclick="pullTrigger()">PULL TRIGGER</button>
            <button class="btn-action btn-cashout" id="btnCashout" onclick="cashOut()">CASHOUT</button>
        </div>

    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const statusBadge = document.getElementById('statusBadge');
        const cylinder = document.getElementById('cylinder');
        const btnPlay = document.getElementById('btnPlay');
        const btnPull = document.getElementById('btnPull');
        const btnCashout = document.getElementById('btnCashout');
        const betInput = document.getElementById('betAmount');

        let balance = 10000.00;
        let isPlaying = false;
        let currentStep = 0;
        let currentBet = 0;
        let bulletIndex = 0;
        
        const multipliers = [1.2, 1.5, 2.4, 5.0, 25.0];

        function resetChambers() {
            for(let i=0; i<6; i++) {
                document.getElementById(`ch-${i}`).className = `chamber c-${i}`;
            }
        }

        function startGame() {
            const amt = parseFloat(betInput.value);
            if (isNaN(amt) || amt <= 0) return alert('Invalid Bet');
            if (amt > balance) return alert('Insufficient Balance');

            balance -= amt;
            currentBet = amt;
            balanceEl.innerText = balance.toFixed(2);
            
            isPlaying = true;
            currentStep = 0;
            
            btnPlay.style.display = 'none';
            btnPull.style.display = 'block';
            btnCashout.style.display = 'block';
            btnPull.disabled = true;
            btnCashout.disabled = true;
            betInput.disabled = true;

            resetChambers();
            for(let i=1; i<=5; i++) document.getElementById(`step-${i}`).className = 'step';

            statusBadge.innerText = 'LOADING CYLINDER...';
            statusBadge.style.color = '#fff';

            // Spin animation
            cylinder.classList.add('spinning');
            
            // Hidden Logic: Random bullet
            bulletIndex = Math.floor(Math.random() * 6);

            setTimeout(() => {
                cylinder.classList.remove('spinning');
                // Random stop rotation visually
                cylinder.style.transform = `rotate(${Math.floor(Math.random()*360)}deg)`;
                
                statusBadge.innerText = 'PULL THE TRIGGER!';
                btnPull.disabled = false;
            }, 1000);
        }

        function pullTrigger() {
            if (!isPlaying) return;
            btnPull.disabled = true;
            btnCashout.disabled = true;

            statusBadge.innerText = '*CLICK*';
            
            setTimeout(() => {
                // If the current step matches the bullet index, you die
                if (currentStep === bulletIndex) {
                    document.getElementById(`ch-${currentStep}`).classList.add('dead');
                    endGame(false, 'BANG! YOU DIED.');
                } else {
                    document.getElementById(`ch-${currentStep}`).classList.add('safe');
                    
                    const stepEl = document.getElementById(`step-${currentStep+1}`);
                    stepEl.classList.add('active');
                    if(currentStep > 0) document.getElementById(`step-${currentStep}`).classList.replace('active', 'passed');

                    const win = currentBet * multipliers[currentStep];
                    btnCashout.innerText = `CASHOUT (₹${win.toFixed(2)})`;
                    btnCashout.disabled = false;
                    btnPull.disabled = false;

                    currentStep++;
                    
                    if (currentStep >= 5) {
                        endGame(true, 'SURVIVED! MAX WIN!');
                    } else {
                        statusBadge.innerText = 'SAFE! PULL AGAIN?';
                        statusBadge.style.color = 'var(--accent-green)';
                    }
                }
            }, 400);
        }

        function cashOut() {
            if (!isPlaying || currentStep === 0) return;
            endGame(true, 'CASHED OUT ALIVE!');
        }

        function endGame(won, msg) {
            isPlaying = false;
            btnPull.style.display = 'none';
            btnCashout.style.display = 'none';
            btnPlay.style.display = 'block';
            betInput.disabled = false;

            // Reveal bullet
            document.getElementById(`ch-${bulletIndex}`).classList.add('dead');

            if (won) {
                const winAmt = currentBet * multipliers[currentStep - 1];
                balance += winAmt;
                balanceEl.innerText = balance.toFixed(2);
                statusBadge.innerText = `${msg} WON ₹${winAmt.toFixed(2)}`;
                statusBadge.style.color = 'var(--accent-gold)';
            } else {
                statusBadge.innerText = msg;
                statusBadge.style.color = 'var(--accent-red)';
            }
        }
    </script>
</body>
</html>
