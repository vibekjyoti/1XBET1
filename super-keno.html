<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Super Keno 80</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-purple: #8e44ad; --accent-gold: #f1c40f; --accent-green: #2ecc71; --accent-red: #e74c3c;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 20; }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: #238cf5; }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-purple); }

        .layout { display: flex; gap: 20px; justify-content: center; align-items: flex-start; padding: 25px 15px; max-width: 1000px; margin: auto; width: 100%; }

        /* Left Side: 80 Grid */
        .game-main { flex: 2; background: var(--bg-panel); border-radius: 16px; border: 1px solid var(--border-color); padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .header-text { font-size: 14px; font-weight: 900; color: var(--accent-gold); letter-spacing: 1px; }
        .btn-clear { background: #333; color: white; border: none; padding: 6px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        .keno-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
        .k-num { aspect-ratio: 1; background: #1a2a3a; border: 1px solid #2c3e50; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.1s; user-select: none; }
        .k-num:hover:not(.drawn) { background: #2c3e50; }
        .k-num.selected { background: var(--accent-purple); border-color: #fff; box-shadow: 0 0 10px rgba(142,68,173,0.6); }
        .k-num.drawn { background: var(--accent-red); border-color: #ff7675; opacity: 0.8; }
        .k-num.matched { background: var(--accent-gold); border-color: #fff; color: #111; box-shadow: 0 0 15px rgba(241,196,15,0.8); transform: scale(1.1); z-index: 2; font-weight: 900; opacity: 1; }

        /* Balls Tray */
        .balls-tray { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; background: #111; padding: 10px; border-radius: 8px; border: 1px solid #222; }
        .drawn-ball { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at top left, #ff7675, #e74c3c); display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); animation: popIn 0.2s; }
        .drawn-ball.matched { background: radial-gradient(circle at top left, #ffeaa7, #f1c40f); color: #111; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* Right Side: Paytable & Controls */
        .side-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .paytable { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
        .pt-title { font-size: 14px; font-weight: 900; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 10px; color: var(--accent-purple); text-align: center; }
        .pt-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 5px; border-bottom: 1px solid #1a3148; }
        .pt-row:last-child { border-bottom: none; }
        .pt-match { color: var(--text-muted); }
        .pt-multi { font-weight: bold; color: #fff; }
        .pt-row.active { background: rgba(241,196,15,0.2); border-radius: 4px; color: var(--accent-gold); }

        .controls { background: var(--bg-panel); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-draw { background: var(--accent-green); color: white; font-size: 18px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 #1e7e34; padding: 15px; transition: 0.1s; }
        .btn-draw:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-draw:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .k-num { font-size: 14px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="wallet">₹ <span id="balance">10000.00</span></div>
    </header>

    <div class="layout">
        <div class="game-main">
            <div class="header-bar">
                <div class="header-text" id="statusHeader">PICK UP TO 10 NUMBERS</div>
                <button class="btn-clear" onclick="clearSelection()">CLEAR</button>
            </div>
            
            <div class="keno-grid" id="grid">
                <!-- JS generated 1-80 -->
            </div>

            <div class="balls-tray" id="tray"></div>
        </div>

        <div class="side-panel">
            <div class="paytable" id="paytable">
                <div class="pt-title">PAYTABLE (0 SELECTED)</div>
                <div style="text-align:center; font-size:12px; color:#888;">Select numbers to view payouts</div>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label>BET AMOUNT (₹)</label>
                    <input type="number" id="betAmount" value="100" min="10">
                </div>
                <button class="btn-draw" id="btnDraw" onclick="startDraw()">DRAW 20 BALLS</button>
            </div>
        </div>
    </div>

    <script>
        let balance = 10000.00;
        let selectedNumbers = [];
        let isDrawing = false;
        const maxPicks = 10;
        const totalDraws = 20;

        const balanceEl = document.getElementById('balance');
        const grid = document.getElementById('grid');
        const tray = document.getElementById('tray');
        const btnDraw = document.getElementById('btnDraw');
        const statusHeader = document.getElementById('statusHeader');
        const paytableEl = document.getElementById('paytable');

        // Standard 10-spot Keno Paytable
        const payoutMatrix = {
            1: { 1: 3.8 },
            2: { 2: 12 },
            3: { 2: 1, 3: 42 },
            4: { 2: 1, 3: 3, 4: 130 },
            5: { 3: 1, 4: 15, 5: 700 },
            6: { 3: 1, 4: 5, 5: 80, 6: 2000 },
            7: { 3: 1, 4: 2, 5: 20, 6: 400, 7: 5000 },
            8: { 4: 2, 5: 10, 6: 50, 7: 1000, 8: 10000 },
            9: { 4: 1, 5: 5, 6: 20, 7: 200, 8: 4000, 9: 20000 },
            10:{ 0: 2, 5: 2, 6: 10, 7: 50, 8: 500, 9: 10000, 10: 50000 }
        };

        for (let i = 1; i <= 80; i++) {
            const btn = document.createElement('div');
            btn.className = 'k-num';
            btn.innerText = i;
            btn.onclick = () => toggleNumber(i, btn);
            grid.appendChild(btn);
        }

        function toggleNumber(num, el) {
            if (isDrawing) return;
            const idx = selectedNumbers.indexOf(num);
            
            if (idx > -1) {
                selectedNumbers.splice(idx, 1);
                el.classList.remove('selected');
            } else {
                if (selectedNumbers.length >= maxPicks) return;
                selectedNumbers.push(num);
                el.classList.add('selected');
            }
            
            updatePaytable();
            document.querySelectorAll('.k-num').forEach(b => b.classList.remove('drawn', 'matched'));
            tray.innerHTML = '';
            statusHeader.innerText = `SELECTED: ${selectedNumbers.length} / ${maxPicks}`;
            statusHeader.style.color = 'var(--accent-gold)';
        }

        function clearSelection() {
            if (isDrawing) return;
            selectedNumbers = [];
            document.querySelectorAll('.k-num').forEach(b => b.classList.remove('selected', 'drawn', 'matched'));
            updatePaytable();
            tray.innerHTML = '';
            statusHeader.innerText = `PICK UP TO 10 NUMBERS`;
        }

        function updatePaytable() {
            const picks = selectedNumbers.length;
            if (picks === 0) {
                paytableEl.innerHTML = '<div class="pt-title">PAYTABLE (0 SELECTED)</div><div style="text-align:center; font-size:12px; color:#888;">Select numbers to view payouts</div>';
                return;
            }

            let html = `<div class="pt-title">PAYTABLE (${picks} SELECTED)</div>`;
            const table = payoutMatrix[picks];
            
            const keys = Object.keys(table).map(Number).sort((a,b)=>b-a);
            keys.forEach(hits => {
                html += `<div class="pt-row" id="pt-row-${hits}"><span class="pt-match">${hits} Hits</span><span class="pt-multi">${table[hits]}x</span></div>`;
            });
            paytableEl.innerHTML = html;
        }

        function startDraw() {
            if (selectedNumbers.length === 0) return alert('Select at least 1 number!');
            const betAmt = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(betAmt) || betAmt <= 0) return alert('Invalid Bet');
            if (betAmt > balance) return alert('Insufficient Balance');

            balance -= betAmt;
            balanceEl.innerText = balance.toFixed(2);
            isDrawing = true;
            btnDraw.disabled = true;
            tray.innerHTML = '';
            
            document.querySelectorAll('.k-num').forEach(b => b.classList.remove('drawn', 'matched'));
            document.querySelectorAll('.pt-row').forEach(r => r.classList.remove('active'));

            statusHeader.innerText = 'DRAWING 20 BALLS...';
            statusHeader.style.color = '#fff';

            let winningNumbers = [];
            while (winningNumbers.length < totalDraws) {
                let r = Math.floor(Math.random() * 80) + 1;
                if (!winningNumbers.includes(r)) winningNumbers.push(r);
            }

            let hits = 0;
            let drawIndex = 0;

            const drawAnim = setInterval(() => {
                const num = winningNumbers[drawIndex];
                const isMatch = selectedNumbers.includes(num);
                
                const ball = document.createElement('div');
                ball.className = `drawn-ball ${isMatch ? 'matched' : ''}`;
                ball.innerText = num;
                tray.appendChild(ball);

                const gridCell = grid.children[num - 1];
                if (isMatch) {
                    gridCell.classList.add('matched');
                    hits++;
                } else {
                    gridCell.classList.add('drawn');
                }

                drawIndex++;
                if (drawIndex >= totalDraws) {
                    clearInterval(drawAnim);
                    resolveWin(hits, betAmt);
                }
            }, 100);
        }

        function resolveWin(hits, betAmt) {
            const table = payoutMatrix[selectedNumbers.length];
            const multiplier = table[hits] || 0;

            if (multiplier > 0) {
                const win = betAmt * multiplier;
                balance += win;
                balanceEl.innerText = balance.toFixed(2);
                statusHeader.innerText = `${hits} HITS! WON ₹${win.toFixed(2)}`;
                statusHeader.style.color = 'var(--accent-green)';
                const r = document.getElementById(`pt-row-${hits}`);
                if(r) r.classList.add('active');
            } else {
                statusHeader.innerText = `${hits} HITS. NO WIN.`;
                statusHeader.style.color = 'var(--accent-red)';
            }

            setTimeout(() => {
                isDrawing = false;
                btnDraw.disabled = false;
            }, 1000);
        }
    </script>
</body>
</html>
