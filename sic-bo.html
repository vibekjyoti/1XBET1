<!-- Save this as sic-bo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Sic Bo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-blue: #238cf5; --accent-red: #e6003d; --accent-gold: #ffc107; --accent-green: #28a745;
            --table-teal: #084c61;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 20; }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-blue); }

        .layout { display: flex; flex-direction: column; align-items: center; padding: 25px 15px; flex: 1; gap: 20px; }

        /* Dome and Dice Area */
        .shaker-container { width: 100%; max-width: 800px; height: 260px; background: radial-gradient(ellipse at center, var(--table-teal) 0%, #031a22 100%); border-radius: 16px; border: 3px solid #1f3a56; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        
        .dome { width: 180px; height: 180px; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.6) 100%); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; gap: 15px; box-shadow: inset 0 -10px 30px rgba(0,0,0,0.8), 0 20px 30px rgba(0,0,0,0.6); position: relative; z-index: 10; padding: 10px; }
        
        .shaking { animation: shakeDome 0.3s infinite ease-in-out; }
        @keyframes shakeDome { 
            0% { transform: translate(2px, 2px) rotate(0deg); }
            25% { transform: translate(-2px, -2px) rotate(-2deg); }
            50% { transform: translate(-2px, 2px) rotate(2deg); }
            75% { transform: translate(2px, -2px) rotate(-1deg); }
            100% { transform: translate(2px, 2px) rotate(0deg); }
        }

        .die { width: 45px; height: 45px; background: #fff; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: 900; color: #e6003d; box-shadow: inset -2px -3px 8px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.5); }
        
        .sum-badge { position: absolute; top: 15px; right: 20px; font-size: 24px; font-weight: 900; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 8px; border: 1px solid var(--border-color); color: var(--accent-gold); }

        .status-msg { font-size: 16px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* Betting Board */
        .betting-board { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 800px; }
        
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        .bet-btn { background: var(--bg-panel); border: 2px solid var(--border-color); border-radius: 10px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .bet-btn:hover { background: #182c40; transform: translateY(-2px); }
        .bet-btn.selected { border-color: var(--accent-gold); transform: scale(1.03); background: #132435; z-index: 2; box-shadow: 0 0 20px rgba(255,193,7,0.3); }
        
        .btn-title { font-size: 20px; font-weight: 900; text-transform: uppercase; margin-bottom: 2px; }
        .btn-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .btn-payout { font-size: 13px; font-weight: bold; color: var(--accent-gold); }

        .btn-small .btn-title { color: #5bc0be; }
        .btn-big .btn-title { color: #ff6b6b; }
        
        .chip-icon { position: absolute; top: -10px; right: -10px; width: 35px; height: 35px; background: radial-gradient(circle, #ffc107 0%, #e6a800 100%); border: 2px dashed #fff; border-radius: 50%; opacity: 0; transform: scale(0); transition: 0.3s; display: flex; justify-content: center; align-items: center; color: #000; font-size: 14px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .bet-btn.selected .chip-icon { opacity: 1; transform: scale(1); }

        /* Controls */
        .controls { display: flex; gap: 15px; width: 100%; max-width: 800px; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-roll { flex: 1; background: var(--accent-green); color: white; font-size: 22px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 0 #186629; transition: transform 0.1s; }
        .btn-roll:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #186629; }
        .btn-roll:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }

        @media (max-width: 768px) {
            .row-3 { grid-template-columns: 1fr; }
            .shaker-container { height: 220px; }
            .dome { width: 150px; height: 150px; }
            .die { width: 35px; height: 35px; font-size: 22px; }
            .controls { flex-direction: column; padding: 15px; gap: 10px; }
            .btn-roll { padding: 15px; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="header-right">
            <div class="wallet">₹ <span id="balance">10000.00</span></div>
            <button class="close-btn" onclick="window.location.href='index.html'">HUB</button>
        </div>
    </header>

    <div class="layout">
        
        <div class="shaker-container">
            <div class="sum-badge" id="sumBadge">SUM: ?</div>
            
            <div class="dome" id="dome">
                <div class="die" id="die1">3</div>
                <div class="die" id="die2">4</div>
                <div class="die" id="die3">5</div>
            </div>

            <div class="status-msg" id="statusMsg">PLACE YOUR BET</div>
        </div>

        <div class="betting-board">
            <div class="row-2">
                <div class="bet-btn btn-small" onclick="selectBet('SMALL', 2, this)">
                    <div class="chip-icon">✔</div>
                    <div class="btn-title">SMALL</div>
                    <div class="btn-desc">Sum 4-10 (Loses on Triple)</div>
                    <div class="btn-payout">PAYS 2x</div>
                </div>
                <div class="bet-btn btn-big" onclick="selectBet('BIG', 2, this)">
                    <div class="chip-icon">✔</div>
                    <div class="btn-title">BIG</div>
                    <div class="btn-desc">Sum 11-17 (Loses on Triple)</div>
                    <div class="btn-payout">PAYS 2x</div>
                </div>
            </div>
            <div class="row-3">
                <div class="bet-btn" onclick="selectBet('EVEN', 2, this)">
                    <div class="chip-icon">✔</div>
                    <div class="btn-title">EVEN</div>
                    <div class="btn-desc">Total is Even (Loses on Triple)</div>
                    <div class="btn-payout">PAYS 2x</div>
                </div>
                <div class="bet-btn" onclick="selectBet('ODD', 2, this)">
                    <div class="chip-icon">✔</div>
                    <div class="btn-title">ODD</div>
                    <div class="btn-desc">Total is Odd (Loses on Triple)</div>
                    <div class="btn-payout">PAYS 2x</div>
                </div>
                <div class="bet-btn" onclick="selectBet('ANY TRIPLE', 30, this)">
                    <div class="chip-icon">✔</div>
                    <div class="btn-title">ANY TRIPLE</div>
                    <div class="btn-desc">Three of a kind (e.g. 2,2,2)</div>
                    <div class="btn-payout">PAYS 30x</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>BET AMOUNT (₹)</label>
                <input type="number" id="betAmount" value="200" min="10">
            </div>
            <button class="btn-roll" id="btnRoll" onclick="rollDice()">SHAKE & ROLL</button>
        </div>

    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const sumBadge = document.getElementById('sumBadge');
        const statusMsg = document.getElementById('statusMsg');
        const dome = document.getElementById('dome');
        const btnRoll = document.getElementById('btnRoll');
        const dice = [document.getElementById('die1'), document.getElementById('die2'), document.getElementById('die3')];

        let balance = 10000.00;
        let selectedBet = null;
        let currentMultiplier = 0;
        let isRolling = false;

        function selectBet(bet, multi, el) {
            if (isRolling) return;
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedBet = bet;
            currentMultiplier = multi;
            statusMsg.innerText = `BET LOCKED: ${bet}`;
            statusMsg.style.color = '#fff';
        }

        function rollDice() {
            if (!selectedBet) return alert('Select a betting zone first!');
            const betAmt = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(betAmt) || betAmt <= 0) return alert('Invalid Bet Amount');
            if (betAmt > balance) return alert('Insufficient Balance');

            balance -= betAmt;
            balanceEl.innerText = balance.toFixed(2);
            isRolling = true;
            btnRoll.disabled = true;

            statusMsg.innerText = 'SHAKING...';
            dome.classList.add('shaking');

            // Tumbling visual
            const tumbleInterval = setInterval(() => {
                dice.forEach(die => {
                    die.innerText = Math.floor(Math.random() * 6) + 1;
                    die.style.transform = `rotate(${Math.random() * 360}deg) translate(${Math.random() * 20 - 10}px, ${Math.random() * 20 - 10}px)`;
                });
            }, 80);

            setTimeout(() => {
                clearInterval(tumbleInterval);
                dome.classList.remove('shaking');

                // Determine results
                const d1 = Math.floor(Math.random() * 6) + 1;
                const d2 = Math.floor(Math.random() * 6) + 1;
                const d3 = Math.floor(Math.random() * 6) + 1;
                const sum = d1 + d2 + d3;
                const isTriple = (d1 === d2 && d2 === d3);

                dice[0].innerText = d1;
                dice[1].innerText = d2;
                dice[2].innerText = d3;
                
                // Reset positions
                dice.forEach(die => die.style.transform = 'none');
                
                sumBadge.innerText = `SUM: ${sum}`;

                // Sic Bo Evaluation Logic
                let won = false;

                if (selectedBet === 'ANY TRIPLE') {
                    if (isTriple) won = true;
                } else {
                    // Standard bets lose on Triple in Sic Bo
                    if (!isTriple) {
                        if (selectedBet === 'SMALL' && sum >= 4 && sum <= 10) won = true;
                        if (selectedBet === 'BIG' && sum >= 11 && sum <= 17) won = true;
                        if (selectedBet === 'EVEN' && sum % 2 === 0) won = true;
                        if (selectedBet === 'ODD' && sum % 2 !== 0) won = true;
                    }
                }

                if (won) {
                    const winnings = betAmt * currentMultiplier;
                    balance += winnings;
                    balanceEl.innerText = balance.toFixed(2);
                    statusMsg.innerText = `WON ₹${winnings.toFixed(2)}!`;
                    statusMsg.style.color = 'var(--accent-green)';
                } else {
                    if (isTriple && selectedBet !== 'ANY TRIPLE') {
                        statusMsg.innerText = 'TRIPLE ROLLED. BETS LOST!';
                    } else {
                        statusMsg.innerText = 'BET LOST.';
                    }
                    statusMsg.style.color = 'var(--accent-red)';
                }

                setTimeout(() => {
                    isRolling = false;
                    btnRoll.disabled = false;
                    statusMsg.innerText = 'PLACE YOUR BET';
                    statusMsg.style.color = '#fff';
                    document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
                    selectedBet = null;
                }, 3500);

            }, 2000);
        }
    </script>
</body>
</html>
