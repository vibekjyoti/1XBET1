<!-- Save this as video-slot.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - 5 Reel Slots</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-gold: #f1c40f; --accent-blue: #238cf5; --accent-green: #2ecc71;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 20; }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-blue); }

        .layout { display: flex; flex-direction: column; align-items: center; padding: 30px 15px; flex: 1; gap: 20px; width: 100%; max-width: 900px; margin: auto; }

        /* Slot Machine Area */
        .slot-machine { width: 100%; background: linear-gradient(180deg, #1e0936 0%, #4a154b 100%); padding: 25px 15px; border-radius: 16px; border: 4px solid var(--accent-gold); box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; position: relative; }
        
        .slot-title { text-align: center; font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 10px var(--accent-gold); letter-spacing: 4px; margin-bottom: 5px; }

        /* Reels Grid */
        .reels-grid { display: flex; gap: 10px; background: #000; padding: 15px; border-radius: 12px; border: 2px solid #333; box-shadow: inset 0 0 30px rgba(0,0,0,0.9); }
        .reel { flex: 1; height: 260px; background: #fff; border-radius: 6px; overflow: hidden; position: relative; display: flex; flex-direction: column; align-items: center; }
        
        .symbols-column { display: flex; flex-direction: column; width: 100%; transition: transform 0.1s linear; }
        .symbol { height: 86px; display: flex; justify-content: center; align-items: center; font-size: 55px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3)); border-bottom: 1px solid #eee; }
        
        .reel.spinning .symbols-column { filter: blur(3px); }

        .status-msg { background: rgba(0,0,0,0.8); padding: 12px 20px; border-radius: 8px; font-weight: 900; font-size: 16px; color: var(--accent-gold); text-align: center; text-transform: uppercase; letter-spacing: 2px; border: 1px solid rgba(255,193,7,0.3); }

        /* Controls */
        .controls { display: flex; gap: 15px; width: 100%; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; }
        
        .btn-spin { flex: 1; background: var(--accent-green); color: white; font-size: 22px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 0 #1e7e34; transition: 0.1s; }
        .btn-spin:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-spin:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; transform: none; }

        @media (max-width: 768px) {
            .reels-grid { gap: 5px; padding: 10px; }
            .reel { height: 180px; }
            .symbol { height: 60px; font-size: 35px; }
            .controls { flex-direction: column; }
            .btn-spin { padding: 15px; width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="window.location.href='index.html'">1X<span>BET</span></div>
        <div class="wallet">₹ <span id="balance">10000.00</span></div>
    </header>

    <div class="layout">
        <div class="slot-machine">
            <div class="slot-title">SUPER 5-REEL</div>
            
            <div class="reels-grid">
                <div class="reel" id="reel-0"><div class="symbols-column" id="col-0"></div></div>
                <div class="reel" id="reel-1"><div class="symbols-column" id="col-1"></div></div>
                <div class="reel" id="reel-2"><div class="symbols-column" id="col-2"></div></div>
                <div class="reel" id="reel-3"><div class="symbols-column" id="col-3"></div></div>
                <div class="reel" id="reel-4"><div class="symbols-column" id="col-4"></div></div>
            </div>

            <div class="status-msg" id="statusMsg">MATCH 3+ ON CENTER LINE TO WIN</div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>BET AMOUNT (₹)</label>
                <input type="number" id="betAmount" value="200" min="10">
            </div>
            <button class="btn-spin" id="btnSpin" onclick="spinSlots()">SPIN</button>
        </div>
    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const statusMsg = document.getElementById('statusMsg');
        const btnSpin = document.getElementById('btnSpin');
        const cols = [
            document.getElementById('col-0'), document.getElementById('col-1'), 
            document.getElementById('col-2'), document.getElementById('col-3'), 
            document.getElementById('col-4')
        ];
        const reels = [
            document.getElementById('reel-0'), document.getElementById('reel-1'), 
            document.getElementById('reel-2'), document.getElementById('reel-3'), 
            document.getElementById('reel-4')
        ];

        let balance = 10000.00;
        let isSpinning = false;

        const symbols = ['🍒', '🍋', '🍇', '🔔', '💎', '7️⃣'];
        const payouts = { '🍒': 2, '🍋': 3, '🍇': 5, '🔔': 10, '💎': 25, '7️⃣': 100 };

        function getRandomSymbol() {
            const r = Math.random();
            if (r < 0.3) return '🍒';
            if (r < 0.6) return '🍋';
            if (r < 0.8) return '🍇';
            if (r < 0.92) return '🔔';
            if (r < 0.98) return '💎';
            return '7️⃣';
        }

        // Initialize board
        function fillInitial() {
            cols.forEach(col => {
                col.innerHTML = '';
                for(let i=0; i<3; i++) col.innerHTML += `<div class="symbol">${getRandomSymbol()}</div>`;
            });
        }
        fillInitial();

        function spinSlots() {
            if (isSpinning) return;
            const betAmt = parseFloat(document.getElementById('betAmount').value);
            if (isNaN(betAmt) || betAmt <= 0) return alert('Invalid Bet');
            if (betAmt > balance) return alert('Insufficient Balance');

            balance -= betAmt;
            balanceEl.innerText = balance.toFixed(2);
            isSpinning = true;
            btnSpin.disabled = true;
            
            statusMsg.innerText = 'SPINNING...';
            statusMsg.style.color = '#fff';

            let finalResults = [[], [], [], [], []]; // 5 cols x 3 rows
            let intervals = [];

            reels.forEach((reel, rIdx) => {
                reel.classList.add('spinning');
                
                intervals[rIdx] = setInterval(() => {
                    cols[rIdx].innerHTML = `
                        <div class="symbol">${getRandomSymbol()}</div>
                        <div class="symbol">${getRandomSymbol()}</div>
                        <div class="symbol">${getRandomSymbol()}</div>
                    `;
                }, 80);

                // Staggered stop (Left to Right)
                const stopTime = 800 + (rIdx * 400);
                setTimeout(() => {
                    clearInterval(intervals[rIdx]);
                    reel.classList.remove('spinning');
                    
                    const sym1 = getRandomSymbol();
                    const sym2 = getRandomSymbol();
                    const sym3 = getRandomSymbol();
                    
                    finalResults[rIdx] = [sym1, sym2, sym3];
                    cols[rIdx].innerHTML = `
                        <div class="symbol">${sym1}</div>
                        <div class="symbol">${sym2}</div>
                        <div class="symbol">${sym3}</div>
                    `;

                    if (rIdx === 4) {
                        evaluateLines(finalResults, betAmt);
                    }
                }, stopTime);
            });
        }

        function evaluateLines(results, betAmt) {
            // Check Center Line (Row index 1)
            const centerLine = [results[0][1], results[1][1], results[2][1], results[3][1], results[4][1]];
            
            let matchCount = 1;
            let matchSymbol = centerLine[0];
            
            for(let i=1; i<5; i++) {
                if(centerLine[i] === matchSymbol) matchCount++;
                else break; // Left to right strict match
            }

            if (matchCount >= 3) {
                const multi = payouts[matchSymbol] * (matchCount === 4 ? 2 : (matchCount === 5 ? 5 : 1));
                const win = betAmt * multi;
                balance += win;
                balanceEl.innerText = balance.toFixed(2);
                
                statusMsg.innerText = `${matchCount} ${matchSymbol}'S IN A ROW! WON ₹${win.toFixed(2)}`;
                statusMsg.style.color = 'var(--accent-green)';
            } else {
                statusMsg.innerText = 'NO MATCH ON CENTER LINE.';
                statusMsg.style.color = 'var(--text-muted)';
            }

            setTimeout(() => {
                isSpinning = false;
                btnSpin.disabled = false;
            }, 1000);
        }
    </script>
</body>
</html>
