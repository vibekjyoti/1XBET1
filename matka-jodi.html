<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1xBet - Matka Jodi 100</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b1520; --bg-panel: #112030; --bg-card: #172b40;
            --text-main: #ffffff; --text-muted: #8d9ba8;
            --accent-gold: #f1c40f; --accent-red: #e74c3c; --accent-blue: #238cf5; --accent-green: #2ecc71;
            --border-color: #1a3148;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        header { background: #081018; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 22px; font-weight: 900; font-style: italic; cursor: pointer; }
        .logo span { color: var(--accent-blue); }
        .wallet { background: var(--bg-card); padding: 8px 15px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-gold); }

        .layout { display: flex; flex-direction: column; align-items: center; padding: 30px 15px; flex: 1; gap: 20px; max-width: 600px; margin: auto; width: 100%; }

        .matka-stage { width: 100%; background: radial-gradient(circle at center, #8e44ad 0%, #2c1e4a 100%); border-radius: 16px; border: 4px solid var(--accent-gold); padding: 30px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.6); position: relative; }
        
        .title { font-size: 24px; font-weight: 900; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }

        /* Pots & Cards */
        .draw-area { display: flex; justify-content: space-around; width: 100%; margin-bottom: 20px; }
        .pot-section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        
        .pot-label { font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 15px; }
        .pot-icon { font-size: 50px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); transition: transform 0.2s; }
        .pot-icon.shaking { animation: shake 0.2s infinite alternate; }
        
        @keyframes shake { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }

        .draw-card { width: 70px; height: 100px; background: #fff; border-radius: 8px; border: 2px solid #ccc; display: flex; justify-content: center; align-items: center; font-size: 45px; font-weight: 900; color: #111; box-shadow: 0 5px 15px rgba(0,0,0,0.5); opacity: 0; transform: translateY(-20px); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .draw-card.revealed { opacity: 1; transform: translateY(0); }

        .result-jodi { font-size: 60px; font-weight: 900; letter-spacing: 5px; color: var(--accent-gold); text-shadow: 0 5px 15px rgba(0,0,0,0.8); height: 70px; display: flex; align-items: center; }

        .status-badge { font-size: 16px; font-weight: 900; letter-spacing: 1px; color: #fff; background: rgba(0,0,0,0.8); padding: 10px 25px; border-radius: 20px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.2); text-align: center; }

        /* Controls */
        .controls { display: flex; flex-direction: column; gap: 15px; width: 100%; background: var(--bg-panel); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        
        .input-row { display: flex; gap: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
        .input-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 6px; outline: none; text-align: center; }
        
        .btn-draw { background: var(--accent-gold); color: #111; font-size: 20px; font-weight: 900; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; padding: 15px; box-shadow: 0 5px 0 #b9770e; transition: 0.1s; }
        .btn-draw:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
        .btn-draw:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }

        @media (max-width: 768px) {
            .input-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">1X<span>BET</span></div>
        <div class="wallet">₹ <span id="balance">10000.00</span></div>
    </header>

    <div class="layout">
        
        <div class="matka-stage">
            <div class="title">MATKA JODI DRAW</div>

            <div class="draw-area">
                <div class="pot-section">
                    <div class="pot-label">OPEN</div>
                    <div class="pot-icon" id="openPot">🏺</div>
                    <div class="draw-card" id="openCard">?</div>
                </div>
                <div class="pot-section">
                    <div class="pot-label">CLOSE</div>
                    <div class="pot-icon" id="closePot">🏺</div>
                    <div class="draw-card" id="closeCard">?</div>
                </div>
            </div>

            <div class="result-jodi" id="jodiResult">- -</div>
            <div class="status-badge" id="statusBadge">GUESS THE JODI (00-99)</div>
        </div>

        <div class="controls">
            <div class="input-row">
                <div class="input-group">
                    <label>JODI PICK (00-99)</label>
                    <input type="number" id="pickNumber" placeholder="e.g. 42" min="0" max="99">
                </div>
                <div class="input-group">
                    <label>BET AMOUNT (₹)</label>
                    <input type="number" id="betAmount" value="100" min="10">
                </div>
            </div>
            <button class="btn-draw" id="btnDraw" onclick="startMatka()">DRAW JODI (PAYS 90x)</button>
        </div>

    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const statusBadge = document.getElementById('statusBadge');
        const btnDraw = document.getElementById('btnDraw');
        const openPot = document.getElementById('openPot');
        const closePot = document.getElementById('closePot');
        const openCard = document.getElementById('openCard');
        const closeCard = document.getElementById('closeCard');
        const jodiResult = document.getElementById('jodiResult');
        
        const betInput = document.getElementById('betAmount');
        const pickInput = document.getElementById('pickNumber');

        let balance = 10000.00;
        let isDrawing = false;

        function startMatka() {
            if (isDrawing) return;
            
            const pick = parseInt(pickInput.value);
            if (isNaN(pick) || pick < 0 || pick > 99) return alert('Enter a valid Jodi between 00 and 99');
            
            // Format to 2 digits string (e.g. 05, 42)
            const pickStr = pick.toString().padStart(2, '0');

            const amt = parseFloat(betInput.value);
            if (isNaN(amt) || amt <= 0) return alert('Invalid Bet Amount');
            if (amt > balance) return alert('Insufficient Balance');

            balance -= amt;
            balanceEl.innerText = balance.toFixed(2);
            isDrawing = true;
            btnDraw.disabled = true;

            // Reset UI
            openCard.classList.remove('revealed');
            closeCard.classList.remove('revealed');
            jodiResult.innerText = '- -';
            jodiResult.style.color = 'var(--text-muted)';
            statusBadge.innerText = 'SHAKING POTS...';
            statusBadge.style.color = '#fff';

            // Generate Results
            const openDigit = Math.floor(Math.random() * 10);
            const closeDigit = Math.floor(Math.random() * 10);
            const finalJodi = `${openDigit}${closeDigit}`;

            // Phase 1: Open Pot
            setTimeout(() => {
                openPot.classList.add('shaking');
                setTimeout(() => {
                    openPot.classList.remove('shaking');
                    openCard.innerText = openDigit;
                    openCard.classList.add('revealed');
                    jodiResult.innerText = `${openDigit} -`;
                    
                    // Phase 2: Close Pot
                    setTimeout(() => {
                        closePot.classList.add('shaking');
                        setTimeout(() => {
                            closePot.classList.remove('shaking');
                            closeCard.innerText = closeDigit;
                            closeCard.classList.add('revealed');
                            jodiResult.innerText = finalJodi;
                            jodiResult.style.color = 'var(--accent-gold)';

                            // Evaluation
                            setTimeout(() => {
                                if (pickStr === finalJodi) {
                                    const win = amt * 90; // Standard Matka 90x payout
                                    balance += win;
                                    balanceEl.innerText = balance.toFixed(2);
                                    statusBadge.innerText = `JODI MATCH! WON ₹${win.toFixed(2)}`;
                                    statusBadge.style.color = 'var(--accent-green)';
                                } else {
                                    statusBadge.innerText = `NO MATCH. BET LOST.`;
                                    statusBadge.style.color = 'var(--accent-red)';
                                }

                                setTimeout(() => {
                                    isDrawing = false;
                                    btnDraw.disabled = false;
                                }, 1500);

                            }, 800);

                        }, 1000);
                    }, 500);

                }, 1000);
            }, 500);
        }
    </script>
</body>
</html>
